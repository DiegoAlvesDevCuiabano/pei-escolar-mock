/* Tela do PEI: documento de um lado, situação, ações e versões fixas do outro. */
function telaPei(id) {
  const p = pei(id), erro = acessoPei(p);
  if (erro) { if (p) auditar('Acesso negado', 'Tentou abrir PEI de estudante sem vínculo'); return semAcesso(erro); }
  const a = aluno(p.aluno), editavel = pode('editarPei') && (p.status === 'elaboracao' || p.status === 'revisao');
  const feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length;
  const acoes = [
    editavel ? `<a class="btn" href="#/peis/${p.id}/etapa/1">Continuar preenchimento</a>` : '',
    editavel ? `<button class="btn giz" data-a="enviarValidacao" data-id="${p.id}">Enviar para validação</button>` : '',
    p.status === 'validacao' && pode('validarPei') ? `<button class="btn" data-a="validarPei" data-id="${p.id}">Validar plano</button><button class="btn perigo" data-a="devolverPei" data-id="${p.id}">Devolver para ajustes</button>` : '',
    p.status === 'ativo' && pode('editarPei') ? `<button class="btn" data-a="iniciarRevisao" data-id="${p.id}">Iniciar revisão</button>` : '',
    `<button class="btn secundario" data-a="imprimir">Gerar PDF</button>`,
  ].join('');
  const avisoValid = p.status === 'validacao' ? (pode('validarPei') ? '<p class="nota giz nao-imprimir">Este plano aguarda a sua validação. Depois de validar, ele vira uma nova versão.</p>' : '<p class="nota giz nao-imprimir">Este plano está com a coordenação para validação.</p>') : '';
  return `${cabeca(`PEI de ${a.nome}`, `${turma(a.turma).nome}. ${STATUS_PEI[p.status].nome}.`, '', `<a href="#/peis">PEIs</a> / ${h(a.nome)}`)}${avisoValid}
  <div class="mesa-pei"><div class="mesa-doc">${documentoPei(p)}</div><aside class="mesa-lado nao-imprimir" aria-label="Situação, ações e versões">
    <section class="bloco"><h2>Situação</h2><p>${seloPei(p)}</p><p class="prog-txt"><span class="mono">${feitas}/12</span> etapas completas</p>${miniProg(feitas, 12)}
      <dl class="resumo-dl"><div><dt>Versão</dt><dd>${p.versoes.length ? mono('v' + p.versoes.length) : 'Rascunho'}</dd></div><div><dt>Próxima revisão</dt><dd>${dm(p.proximaRevisao)}</dd></div></dl><a href="#/estudantes/${a.id}/trilha">Ver a trilha de metas</a></section>
    <section class="bloco"><h2>Ações</h2><div class="acoes-pei">${acoes}</div></section>
    <section class="bloco"><h2>Histórico de versões</h2>${p.versoes.length ? `<ol class="tempo">${p.versoes.slice().reverse().map(v => `<li><h3>Versão ${v.n}</h3><p class="sutil">${dm(v.data)} ${h(v.resumo)}. Validada por ${h(nomeProf(v.validadoPor))}.</p></li>`).join('')}</ol>` : '<p class="sutil">A primeira versão nasce quando a coordenação validar o plano.</p>'}</section>
  </aside></div>`;
}

/* Formulário de 12 etapas: lista fixa à esquerda, barra de ações sempre no rodapé. */
function telaEtapa(id, nTexto) {
  const p = pei(id), erro = acessoPei(p), n = Math.min(12, Math.max(1, +nTexto || 1));
  if (erro) return semAcesso(erro);
  if (!pode('editarPei')) { auditar('Acesso negado', 'Tentou editar um PEI'); return semAcesso('Seu perfil lê o plano, mas não edita.'); }
  if (p.status !== 'elaboracao' && p.status !== 'revisao') return `${cabeca('Este plano não está aberto para edição', 'Para mudar um plano ativo, inicie uma revisão. Assim a versão validada fica preservada.')}<a class="btn" href="#/peis/${p.id}">Voltar ao plano</a>`;
  const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length;
  setTimeout(() => { const c = document.querySelector('.etapas [aria-current]'); if (c) { const ol = c.closest('.etapas'); if (ol.scrollWidth > ol.clientWidth) ol.scrollLeft = c.offsetLeft - ol.clientWidth / 2 + c.offsetWidth / 2; } }, 0);
  return `${cabeca(`PEI de ${a.nome}`, '', `<a class="btn secundario" href="#/peis/${p.id}" data-a="sairEtapa" data-id="${p.id}" data-n="${n}">Salvar e ver o plano</a>`, `<a href="#/peis">PEIs</a> / <a href="#/peis/${p.id}">${h(a.nome)}</a> / Etapa ${n}`)}
  <div class="assistente mesa-etapas"><nav aria-label="Etapas do PEI"><ol class="etapas">${ETAPAS.map((nome, i) => `<li class="${etapaCompleta(p, i + 1) ? 'feita' : ''}"><a href="#/peis/${p.id}/etapa/${i + 1}" data-a="irEtapa" data-id="${p.id}" data-n="${n}" data-para="${i + 1}" ${n === i + 1 ? 'aria-current="step"' : ''}><i class="mono">${etapaCompleta(p, i + 1) ? '✓' : i + 1}</i><span>${h(nome)}</span></a></li>`).join('')}<li class="etapas-progresso"><span class="mono">${feitas}/12</span> completas</li></ol></nav>
  <form id="form-etapa" class="bloco" data-pei="${p.id}" data-n="${n}"><div class="etapa-cabeca"><h2>${n}. ${h(ETAPAS[n - 1])}</h2><span class="mono">Etapa ${n} de 12</span></div>${corpoEtapa(p, n)}
    <div class="rodape-form barra-acoes"><button type="button" class="btn secundario" data-a="irEtapa" data-id="${p.id}" data-n="${n}" data-para="${n - 1}" ${n === 1 ? 'disabled' : ''}>Etapa anterior</button><span class="prog-barra mono">${feitas}/12 completas</span><div><button type="button" class="btn secundario" data-a="salvarRascunho" data-id="${p.id}" data-n="${n}">Salvar rascunho</button>${n < 12 ? `<button type="button" class="btn" data-a="irEtapa" data-id="${p.id}" data-n="${n}" data-para="${n + 1}">Próxima etapa</button>` : ''}</div></div>
  </form></div>`;
}

/* Portal da família: uma coluna, texto grande, nada de tabela. */
function telaFamilia() {
  if (!pode('verFamilia')) return semAcesso('Este portal é para famílias.');
  const a = alunosVisiveis()[0], p = peiDoAluno(a.id), ms = metasDoPei(p.id), c = p.e.compartilhar || [], primeiro = a.nome.split(' ')[0];
  const alc = ms.filter(m => m.status === 'alcancada').length;
  const proxima = S.eventos.filter(e => e.aluno === a.id && diasAte(e.data) >= 0).sort((x, y) => x.data.localeCompare(y.data))[0];
  return `<div class="fam"><header class="fam-topo">${avatar(a.nome, a.id, true)}<div><h1 tabindex="-1">O plano de ${h(primeiro)}</h1><p>${h(turma(a.turma).nome)}, ${h(S.escola.nome)}. A escola compartilha aqui o que vocês precisam acompanhar.</p></div></header>
  ${p.ciencia ? `<p class="fam-ciencia ok">Você confirmou a leitura do plano em ${fmt(p.ciencia)}.</p>` : `<div class="fam-ciencia"><p>A escola pede que você leia o plano e confirme.</p><button class="btn" data-a="ciencia" data-id="${p.id}">Confirmar que li o plano</button></div>`}
  <section class="fam-bloco fam-data"><h2>Próximo encontro</h2>${proxima ? `<p><b class="mono">${fmt(proxima.data)}</b><span>${h(proxima.titulo)}</span></p>` : '<p class="sutil">Nenhuma data marcada.</p>'}</section>
  ${c.includes('objetivos') ? `<section class="fam-bloco"><h2>O que a escola quer alcançar</h2><p>${h(p.e.objetivoGeral)}</p></section>` : ''}
  ${c.includes('emCasa') ? `<section class="fam-bloco"><h2>Como ajudar em casa</h2><p>${h(p.e.emCasa)}</p></section>` : ''}
  ${c.includes('metas') ? `<section class="fam-bloco"><h2>Como estão as metas</h2><p class="sutil">${alc} de ${ms.length} alcançadas</p>${ms.map(m => `<article class="fam-meta"><div class="meta-cabeca"><h3>${h(m.objetivo)}</h3>${seloMeta(m)}</div>${trilha(m, true)}</article>`).join('')}</section>` : ''}</div>`;
}

/* Atalho "/" leva à busca: a da lista, quando existe, ou a do topo. */
document.addEventListener('keydown', ev => {
  if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const t = ev.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  const modal = document.getElementById('modal'); if (modal && modal.open) return;
  const alvo = document.querySelector('[data-filtro$=".busca"]') || document.getElementById('busca-geral');
  if (alvo) { ev.preventDefault(); alvo.focus(); if (alvo.select) alvo.select(); }
});
function focarLinha(ev) {
  const tr = ev.target.closest && ev.target.closest('tr[data-item][data-id]'); if (!tr) return;
  const res = tr.closest('#resultado'); if (!res) return;
  FOCO[res.dataset.res] = tr.dataset.id; atualizarResumo();
}
document.addEventListener('click', focarLinha);
document.addEventListener('focusin', focarLinha);

r0.dataset.fonte = ler(CHAVE + '_fonte') || 0;
r0.dataset.contraste = ler(CHAVE + '_contraste') || '';
