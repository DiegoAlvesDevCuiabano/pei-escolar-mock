:root{
  --lousa:#17423B; --lousa-escura:#0F3029; --lousa-clara:#24594F;
  --papel:#F2F6F4; --folha:#FFFFFF; --tinta:#14201C; --tinta-2:#46574F; --linha:#CFDBD5; --linha-forte:#9DB0A7;
  --giz:#F4C430; --giz-claro:#FDF3CC; --caneta:#1F4FA8; --caneta-clara:#E3EBFA;
  --ok:#1A7346; --ok-clara:#DDF1E5; --atencao:#8A4F00; --atencao-clara:#FBE9CF;
  --alerta:#B3261E; --alerta-clara:#FBE3E0; --neutro:#5A6A63; --neutro-claro:#E6ECE9;
  --roxo:#5E3796; --roxo-claro:#ECE4F7;
  --fonte:"Atkinson Hyperlegible",Verdana,"Segoe UI",Tahoma,sans-serif;
  --lateral:256px;
}
html[data-contraste="alto"]{
  --papel:#FFFFFF; --tinta:#000000; --tinta-2:#1C1C1C; --linha:#333333; --linha-forte:#000000;
  --lousa:#000000; --lousa-escura:#000000; --lousa-clara:#222222;
  --caneta:#0B2F8A; --ok:#0B5A32; --atencao:#663800; --alerta:#8E0F0A; --neutro:#222222;
}
html{font-size:100%;scroll-behavior:smooth}
html[data-fonte="1"]{font-size:112.5%}
html[data-fonte="2"]{font-size:125%}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:1rem;line-height:1.5}
h1,h2,h3,h4{line-height:1.2;margin:0;font-weight:700}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0 0 .75rem}
a{color:var(--caneta)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--caneta);outline-offset:2px;border-radius:3px}
.lateral :focus-visible{outline-color:var(--giz)}
.pular{position:absolute;left:-999px;top:8px;background:var(--giz);color:#000;padding:.5rem 1rem;z-index:100;font-weight:700}
.pular:focus{left:8px}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* faixa do protótipo */
.faixa{background:var(--giz);color:#1b1500;font-size:.875rem;padding:.3rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;justify-content:center}
.faixa button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-weight:700;color:inherit}

/* estrutura */
.app{display:grid;grid-template-columns:var(--lateral) minmax(0,1fr);min-height:calc(100vh - 2rem)}
.lateral{background:var(--lousa);color:#EAF3EF;padding:1.1rem .75rem 1.5rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.marca{display:flex;gap:.6rem;align-items:center;padding:.1rem .5rem .6rem;color:#fff;text-decoration:none}
.marca-sinal{width:38px;height:38px;flex:none}
.marca b{display:block;font-size:1.15rem;line-height:1.1}
.marca small{display:block;font-size:.75rem;color:#C6DAD2;line-height:1.2;margin-top:.15rem}
.nav-grupo{margin:0;padding:0;list-style:none}
.nav-titulo{font-size:.8rem;color:#A9C6BB;padding:.2rem .6rem;margin:0}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;color:#EAF3EF;text-decoration:none;border-radius:6px;font-size:.97rem}
.nav-item:hover{background:var(--lousa-clara)}
.nav-item[aria-current="page"]{background:var(--giz);color:#1b1500;font-weight:700}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-marca{margin-left:auto;font-size:.72rem;background:rgba(255,255,255,.14);padding:.05rem .4rem;border-radius:4px}
.nav-item[aria-current="page"] .nav-marca{background:rgba(0,0,0,.12)}
.lateral-rodape{margin-top:auto;font-size:.8rem;color:#BCD3CA;padding:.5rem .6rem 0;border-top:1px solid var(--lousa-clara)}

.corpo{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:.75rem;padding:.6rem 1.5rem;background:var(--folha);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topo-busca{flex:1 1 220px;max-width:420px;position:relative}
.topo-busca input{width:100%;padding:.45rem .7rem;border:1px solid var(--linha-forte);border-radius:6px;background:var(--papel)}
.busca-lista{position:absolute;top:100%;left:0;right:0;background:var(--folha);border:1px solid var(--linha-forte);border-radius:6px;margin-top:4px;padding:.25rem;box-shadow:0 8px 20px rgba(15,48,41,.18);z-index:30}
.busca-lista a{display:block;padding:.4rem .5rem;text-decoration:none;color:var(--tinta);border-radius:4px}
.busca-lista a:hover,.busca-lista a:focus{background:var(--caneta-clara)}
.topo-direita{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.icone-btn.btn-menu{display:none}
h1:focus{outline:none}
.icone-btn{background:none;border:1px solid var(--linha);border-radius:6px;min-width:40px;height:40px;padding:0 .5rem;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.icone-btn:hover{background:var(--papel)}
.icone-btn svg{width:20px;height:20px}
.icone-btn[aria-pressed="true"]{background:var(--tinta);color:#fff}
.bolinha{position:absolute;top:-6px;right:-6px;background:var(--alerta);color:#fff;font-size:.72rem;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.usuario{display:flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--linha);border-radius:6px;padding:.2rem .6rem .2rem .25rem;cursor:pointer;text-align:left;line-height:1.15}
.usuario:hover{background:var(--papel)}
.usuario small{display:block;color:var(--tinta-2);font-size:.78rem}

.conteudo{padding:1.5rem;max-width:1240px;width:100%;margin:0 auto}
.cabeca{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:1.25rem}
.cabeca p{color:var(--tinta-2);margin:.3rem 0 0;max-width:68ch}
.cabeca-acoes{display:flex;gap:.5rem;flex-wrap:wrap}
.migalha{font-size:.9rem;margin-bottom:.4rem;color:var(--tinta-2)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--lousa);color:#fff;border:1px solid var(--lousa);padding:.5rem .95rem;border-radius:6px;cursor:pointer;text-decoration:none;font-weight:700;min-height:42px}
.btn:hover{background:var(--lousa-escura)}
.btn.secundario{background:var(--folha);color:var(--lousa);border-color:var(--linha-forte)}
html[data-contraste="alto"] .btn.secundario{color:#000}
.btn.secundario:hover{background:var(--papel)}
.btn.perigo{background:var(--folha);color:var(--alerta);border-color:var(--alerta)}
.btn.giz{background:var(--giz);color:#1b1500;border-color:#C79B0D}
.btn.pequeno{padding:.2rem .6rem;min-height:34px;font-size:.9rem;font-weight:400}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--caneta);text-decoration:underline;cursor:pointer}

/* blocos */
.bloco{background:var(--folha);border:1px solid var(--linha);border-radius:8px;padding:1.1rem 1.2rem;margin-bottom:1.1rem}
.bloco>h2,.bloco>h3{margin-bottom:.7rem}
.bloco-cabeca{display:flex;justify-content:space-between;gap:.75rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.7rem}
.duas{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.1rem;align-items:start}
.metade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem;align-items:start}
.nota{background:var(--caneta-clara);border-left:4px solid var(--caneta);padding:.6rem .85rem;margin:0 0 1rem;font-size:.95rem}
.nota.giz{background:var(--giz-claro);border-left-color:#C79B0D}
.nota.alerta{background:var(--alerta-clara);border-left-color:var(--alerta)}
.vazio{padding:1.5rem;text-align:center;color:var(--tinta-2)}
.vazio .btn{margin-top:.6rem}
.sutil{color:var(--tinta-2)}
.pequeno-txt{font-size:.9rem}

/* placar do painel: números em tira, não em cartões */
.placar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--lousa);color:#fff;border-radius:8px;margin-bottom:1.1rem;overflow:hidden}
.placar a{color:inherit;text-decoration:none;padding:.95rem 1.15rem;border-left:1px solid rgba(255,255,255,.18);display:block}
.placar a:first-child{border-left:0}
.placar a:hover{background:var(--lousa-clara)}
.placar b{display:block;font-size:2.2rem;line-height:1.1}
.placar span{font-size:.95rem;color:#D8E8E1}
.placar a.destaque b{color:var(--giz)}

/* barra empilhada */
.barra{display:flex;height:30px;border-radius:5px;overflow:hidden;gap:2px;background:var(--folha);margin-bottom:.6rem}
.barra span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;min-width:24px}
.legenda{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.2rem .8rem}
.legenda li{display:flex;align-items:center;gap:.45rem;font-size:.95rem}
.legenda a{color:inherit}
.legenda i{width:13px;height:13px;border-radius:3px;display:inline-block;flex:none}
.legenda b{margin-left:auto}

/* listas */
.lista{list-style:none;margin:0;padding:0}
.lista>li{padding:.6rem 0;border-top:1px solid var(--linha);display:flex;gap:.7rem;align-items:flex-start}
.lista>li:first-child{border-top:0;padding-top:0}
.lista .data{flex:none;width:54px;text-align:center;background:var(--papel);border:1px solid var(--linha);border-radius:6px;line-height:1.1;padding:.25rem 0;font-size:.78rem;color:var(--tinta-2)}
.lista .data b{display:block;font-size:1.2rem;color:var(--tinta)}
.lista .texto{min-width:0;flex:1}
.lista .texto small{display:block;color:var(--tinta-2)}

/* tabela */
.tabela-rolagem{position:relative;overflow-x:auto;border:1px solid var(--linha);border-radius:8px;background:var(--folha)}
table{border-collapse:collapse;width:100%}
th,td{padding:.6rem .8rem;text-align:left;border-top:1px solid var(--linha);vertical-align:middle}
thead th{border-top:0;background:var(--neutro-claro);font-size:.92rem}
tbody tr:hover{background:#F7FAF8}
td.acoes{white-space:nowrap;text-align:right}
.pessoa{display:flex;align-items:center;gap:.55rem;min-width:190px}
.pessoa a{font-weight:700}
.pessoa small{display:block;color:var(--tinta-2);font-weight:400}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--lousa);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:.85rem}
.avatar.grande{width:64px;height:64px;font-size:1.3rem}
.avatar.c1{background:#1F4FA8}.avatar.c2{background:#5E3796}.avatar.c3{background:#8A4F00}.avatar.c4{background:#1A7346}.avatar.c0{background:#17423B}

/* etiquetas */
.selo{display:inline-flex;align-items:center;gap:.3rem;padding:.08rem .55rem;border-radius:4px;font-size:.88rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.selo.neutro{background:var(--neutro-claro);color:#2E3B36}
.selo.azul{background:var(--caneta-clara);color:#173C80}
.selo.verde{background:var(--ok-clara);color:#0F5532}
.selo.ambar{background:var(--atencao-clara);color:#6B3C00}
.selo.roxo{background:var(--roxo-claro);color:#472873}
.selo.vermelho{background:var(--alerta-clara);color:#8E1B14}

/* filtros */
.filtros{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;font-size:.88rem;color:var(--tinta-2);gap:.15rem}
.filtros input,.filtros select{padding:.4rem .55rem;border:1px solid var(--linha-forte);border-radius:6px;background:var(--folha);color:var(--tinta);min-height:40px}
.filtros .cresce{flex:1 1 220px}
.filtros .cresce input{width:100%}

/* abas */
.abas{display:flex;gap:.2rem;border-bottom:2px solid var(--linha);margin-bottom:1.1rem;overflow-x:auto}
.abas a{padding:.5rem .85rem;text-decoration:none;color:var(--tinta-2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.abas a:hover{color:var(--tinta)}
.abas a[aria-current="page"]{color:var(--tinta);font-weight:700;border-bottom-color:var(--lousa)}

/* formulários */
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem 1rem}
.campo{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.campo.largo{grid-column:1/-1}
.campo label,.campo legend,.rotulo{font-weight:700;font-size:.95rem}
.campo small{color:var(--tinta-2)}
.campo input,.campo select,.campo textarea{padding:.5rem .65rem;border:1px solid var(--linha-forte);border-radius:6px;background:var(--folha);width:100%}
.campo textarea{min-height:92px;resize:vertical;line-height:1.45}
.campo.invalido input,.campo.invalido select,.campo.invalido textarea{border-color:var(--alerta);border-width:2px}
.erro{color:var(--alerta);font-size:.9rem;font-weight:700}
fieldset{border:0;padding:0;margin:0;min-width:0}
.marcas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.25rem .9rem;margin-top:.3rem}
.marcas label{display:flex;gap:.45rem;align-items:flex-start;font-weight:400;font-size:.97rem;padding:.15rem 0}
.marcas input{width:18px;height:18px;margin-top:.2rem;flex:none}
.linha-rep{border:1px solid var(--linha);border-radius:8px;padding:.85rem;margin-bottom:.75rem;background:#FAFCFB}
.linha-rep-cabeca{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.rodape-form{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:space-between;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--linha)}
.rodape-form div{display:flex;gap:.5rem;flex-wrap:wrap}

/* ficha do estudante */
.ficha-topo{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.definicoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem 1.4rem;margin:0}
.definicoes div{min-width:0}
.definicoes.um{grid-template-columns:1fr}
.definicoes dt{font-weight:700;font-size:.92rem;color:var(--tinta-2)}
.definicoes dd{margin:0;white-space:pre-line}

/* trilha da meta */
.meta-item{padding:.95rem 0;border-top:1px solid var(--linha)}
.meta-item:first-child{border-top:0;padding-top:.1rem}
.meta-cabeca{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start;flex-wrap:wrap}
.meta-cabeca h3 a{color:inherit;text-decoration:none}
.meta-cabeca h3 a:hover{text-decoration:underline}
.trilha{position:relative;height:50px;margin:.45rem 16px .25rem}
.trilha-linha{position:absolute;left:0;right:0;top:20px;height:6px;background:repeating-linear-gradient(90deg,var(--linha-forte) 0 7px,transparent 7px 13px);border-radius:3px}
.trilha-feita{position:absolute;left:0;top:20px;height:6px;border-radius:3px}
.trilha-passo{position:absolute;top:12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--folha);border:3px solid;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;padding:0;cursor:default}
.trilha-hoje{position:absolute;top:2px;bottom:12px;width:2px;background:var(--tinta)}
.trilha-hoje::after{content:"Hoje";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:.74rem;color:var(--tinta-2)}
.trilha-bandeira{position:absolute;right:-13px;top:4px;width:26px;height:30px}
.trilha-datas{display:flex;justify-content:space-between;font-size:.8rem;color:var(--tinta-2);margin:0 2px}
.meta-rodape{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.3rem}

/* linha do tempo */
.tempo{list-style:none;margin:0;padding:0 0 0 1.2rem;border-left:3px solid var(--linha)}
.tempo>li{position:relative;padding:0 0 1.1rem .7rem}
.tempo>li::before{content:"";position:absolute;left:calc(-1.2rem - 9px);top:.3rem;width:15px;height:15px;border-radius:50%;background:var(--folha);border:3px solid var(--cor,var(--lousa))}
.tempo h3{font-size:1rem}
.tempo .sutil{font-size:.9rem}

/* PEI em etapas */
.assistente{display:grid;grid-template-columns:250px minmax(0,1fr);gap:1.1rem;align-items:start}
.etapas{list-style:none;margin:0;padding:.4rem;background:var(--folha);border:1px solid var(--linha);border-radius:8px;position:sticky;top:72px}
.etapas a{display:flex;gap:.5rem;align-items:center;padding:.3rem .4rem;text-decoration:none;color:var(--tinta);border-radius:5px;font-size:.92rem;line-height:1.2}
.etapas a:hover{background:var(--papel)}
.etapas a[aria-current="step"]{background:var(--lousa);color:#fff;font-weight:700}
.etapas i{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;border:2px solid var(--linha-forte);background:var(--folha);color:var(--tinta)}
.etapas .feita i{background:var(--ok);border-color:var(--ok);color:#fff}
.etapas-progresso{font-size:.88rem;color:var(--tinta-2);padding:.45rem .4rem .1rem}

/* documento: o PEI como folha */
.documento{background:var(--folha);border:1px solid var(--linha);border-radius:4px;padding:2rem 2.3rem;max-width:860px;margin:0 auto;box-shadow:0 1px 0 var(--linha),0 3px 0 -1px var(--folha),0 4px 0 -1px var(--linha)}
.doc-cabeca{border-bottom:3px solid var(--lousa);padding-bottom:.7rem;margin-bottom:1rem}
.doc-cabeca small{color:var(--tinta-2)}
.doc-secao{margin-bottom:1.15rem;break-inside:avoid}
.doc-secao h2{font-size:1.08rem;margin-bottom:.35rem;color:var(--lousa);display:flex;gap:.5rem}
html[data-contraste="alto"] .doc-secao h2{color:#000}
.doc-secao p,.doc-secao li{white-space:pre-line}
.doc-secao ul{margin:0;padding-left:1.2rem}
.doc-tabela{font-size:.93rem;margin-top:.3rem;border:1px solid var(--linha)}
.doc-tabela th,.doc-tabela td{padding:.35rem .5rem}
.assinaturas{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:2.4rem}
.assinaturas div{border-top:1px solid var(--tinta);padding-top:.25rem;font-size:.85rem;text-align:center}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.cal div{background:var(--folha);min-height:96px;padding:.25rem .35rem;font-size:.85rem}
.cal .dia-semana{min-height:0;background:var(--neutro-claro);font-weight:700;text-align:center}
.cal .fora{background:#F1F4F2;color:var(--tinta-2)}
.cal .hoje .num{background:var(--giz);color:#1b1500;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.cal a,.cal button.evento{display:block;width:100%;text-align:left;border:0;font-size:.78rem;line-height:1.2;padding:.12rem .25rem;border-radius:3px;margin-top:.15rem;text-decoration:none;background:var(--caneta-clara);color:#173C80;cursor:pointer}
.cal a.familia{background:var(--ok-clara);color:#0F5532}
.cal a.prazo{background:var(--atencao-clara);color:#6B3C00}

/* permissões */

/* família */
.familia-topo{background:var(--lousa);color:#fff;border-radius:8px;padding:1.3rem 1.4rem;margin-bottom:1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.familia-topo p{margin:.2rem 0 0;color:#D8E8E1}

/* login */
.login{min-height:calc(100vh - 2rem);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-lado{background:var(--lousa);color:#fff;padding:3rem clamp(1.5rem,5vw,4.5rem);display:flex;flex-direction:column;justify-content:center;gap:1.1rem;position:relative;overflow:hidden}
.login-lado h1{font-size:clamp(2.1rem,4vw,3.1rem);line-height:1.08;max-width:15ch}
.login-lado p{max-width:44ch;color:#D8E8E1;font-size:1.1rem;margin:0}
.login-trilha{width:100%;max-width:520px;height:auto;margin-top:.5rem}
.login-form{padding:2.2rem clamp(1.2rem,5vw,4rem);display:flex;flex-direction:column;justify-content:center;gap:1rem;background:var(--folha)}
.login-caixa{width:100%;max-width:440px;margin:0 auto}
.login-caixa h2{font-size:1.5rem;margin-bottom:.8rem}
.login-caixa .campo{margin-bottom:.75rem}
.perfis{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.3rem}
.perfis button{width:100%;display:flex;align-items:center;gap:.6rem;background:var(--folha);border:1px solid var(--linha);padding:.4rem .55rem;border-radius:6px;cursor:pointer;text-align:left;line-height:1.2}
.perfis button:hover{border-color:var(--lousa);background:var(--papel)}
.perfis small{display:block;color:var(--tinta-2)}
.separador{display:flex;align-items:center;gap:.6rem;color:var(--tinta-2);font-size:.9rem;margin:1rem 0 .4rem}
.separador::before,.separador::after{content:"";height:1px;background:var(--linha);flex:1}

/* modal, painel de avisos, mensagem */
dialog{border:0;border-radius:10px;padding:0;width:min(640px,calc(100vw - 2rem));max-height:calc(100vh - 2rem);box-shadow:0 18px 50px rgba(15,48,41,.35);color:var(--tinta);background:var(--folha)}
dialog::backdrop{background:rgba(15,48,41,.55)}
.modal-cabeca{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--folha);z-index:2}
.modal-corpo{padding:1rem 1.2rem}
.modal-rodape{display:flex;justify-content:flex-end;gap:.5rem;padding:.8rem 1.2rem;border-top:1px solid var(--linha);flex-wrap:wrap}
.avisos{position:absolute;right:0;top:calc(100% + 6px);width:min(380px,calc(100vw - 2rem));background:var(--folha);border:1px solid var(--linha-forte);border-radius:8px;box-shadow:0 12px 30px rgba(15,48,41,.25);padding:.6rem .85rem;z-index:40;max-height:70vh;overflow:auto}
.topo-direita .ancora{position:relative}
.mensagem{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:.6rem 1.1rem;border-radius:6px;z-index:90;max-width:calc(100vw - 2rem);box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* barras por período */
.periodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.8rem;align-items:end}
.periodo .pilha{display:flex;flex-direction:column;justify-content:flex-end;height:120px;gap:2px}
.periodo .pilha span{display:block;border-radius:2px;min-height:3px}
.periodo p{text-align:center;margin:.3rem 0 0;font-size:.9rem}

/* responsivo */
@media (max-width:1100px){
  .duas,.metade{grid-template-columns:minmax(0,1fr)}
  .assistente{grid-template-columns:minmax(0,1fr)}
  .etapas{position:static;display:flex;overflow-x:auto;gap:.2rem}
  .etapas li{flex:none}
  .etapas a span{display:none}
  .etapas a[aria-current="step"] span{display:inline}
  .etapas-progresso{display:none}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);z-index:60;transform:translateX(-105%);transition:transform .18s ease}
  .lateral.aberta{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.35)}
  .veu{position:fixed;inset:0;background:rgba(15,48,41,.5);z-index:55}
  .icone-btn.btn-menu{display:inline-flex}
  .topo{padding:.5rem 1rem}
  .topo-busca{order:5;flex-basis:100%;max-width:none}
  .conteudo{padding:1rem}
  .placar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .placar a:nth-child(3){border-left:0}
  .placar a:nth-child(n+3){border-top:1px solid rgba(255,255,255,.18)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-lado{padding:1.5rem 1rem}
  .login-trilha{display:none}
  .usuario span.nome-usuario{display:none}
  .usuario{padding:.2rem}
  .campos,.definicoes{grid-template-columns:minmax(0,1fr)}
  .documento{padding:1.1rem}
  .assinaturas{grid-template-columns:minmax(0,1fr);gap:1.8rem}
  .cal div{min-height:58px;padding:.15rem}
  .cal a{font-size:0;height:9px;padding:0}
  h1{font-size:1.55rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@page{margin:18mm 16mm}
@media print{
  body{background:#fff}
  .faixa,.lateral,.topo,.cabeca,.migalha,.nao-imprimir,.filtros,.mensagem,.abas{display:none!important}
  .app{display:block}
  .conteudo{padding:0;max-width:none}
  .documento{border:0;box-shadow:none;padding:0;max-width:none}
  .duas{display:block}
}

/* Variante B, MESA: cinzas frios, trilho escuro, um acento verde-azulado. Cor forte só em status e alerta. */
:root{
  --fonte:"IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --lateral:5.1rem;
  --lousa:#0E5560; --lousa-escura:#093F48; --lousa-clara:#1B6A76;
  --trilho:#14191E; --trilho-2:#252D35; --trilho-txt:#C5CED6; --trilho-acento:#6FD0D8;
  --papel:#ECEEF0; --folha:#FFFFFF; --tinta:#161B20; --tinta-2:#4A545D;
  --linha:#D4D9DE; --linha-forte:#7C8791; --linha-suave:#E6E9EC;
  --cab-bg:#E3E7EA; --foco-bg:#E4EFF0; --hover-bg:#F2F5F6;
  --giz:#E3B93C; --giz-claro:#FBF4DC; --caneta:#0B5560; --caneta-clara:#E0EEF0;
  --neutro-claro:#E3E7EA;
}
html[data-contraste="alto"]{
  --papel:#FFFFFF; --folha:#FFFFFF; --tinta:#000; --tinta-2:#1A1A1A; --linha:#4A4A4A; --linha-forte:#000; --linha-suave:#777;
  --cab-bg:#DADADA; --foco-bg:#D8D8D8; --hover-bg:#EEEEEE;
  --lousa:#000; --lousa-escura:#000; --lousa-clara:#222; --caneta:#00306E; --caneta-clara:#E6EEF9;
  --trilho:#000; --trilho-2:#2B2B2B; --trilho-txt:#FFFFFF; --trilho-acento:#FFFFFF; --giz:#FFD84D;
}
html[data-contraste="alto"] .selo{border-color:currentColor}
body{font-family:var(--fonte);font-size:.9375rem;line-height:1.45;font-weight:400}
b,strong,th,h1,h2,h3,h4{font-weight:600}
.mono{font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums;font-size:.93em;letter-spacing:-.01em}
h1{font-size:1.4rem;letter-spacing:-.015em}
h2{font-size:1.05rem}
h3{font-size:.95rem}
:focus-visible{outline:2px solid var(--caneta);outline-offset:2px;border-radius:2px}
html[data-contraste="alto"] :focus-visible{outline:3px solid #000;box-shadow:0 0 0 5px #fff}
.lateral :focus-visible{outline-color:var(--trilho-acento);box-shadow:none}

/* faixa do protótipo, discreta */
.faixa{background:var(--cab-bg);color:var(--tinta-2);font-size:.75rem;padding:.2rem 1rem;justify-content:flex-start;gap:1rem;border-bottom:1px solid var(--linha)}
.faixa button{font-weight:500;color:var(--tinta);min-height:24px}

/* trilho */
.lateral{background:var(--trilho);color:var(--trilho-txt);padding:.55rem .3rem 1rem;gap:.35rem;align-items:stretch;overflow-x:hidden;height:100vh;top:0}
.lateral .marca{flex-direction:column;justify-content:center;padding:.3rem 0 .7rem;border-bottom:1px solid var(--trilho-2);gap:.3rem;margin-bottom:.3rem}
.marca-sinal{width:34px;height:34px}
.marca-sinal rect{fill:#0E8B96}
.marca-sinal path{stroke:#fff}.marca-sinal path:last-of-type{fill:#fff}.marca-sinal circle{fill:#fff}
.marca-nome{display:none}
.nav-grupo{display:flex;flex-direction:column;gap:2px}
.nav-item{flex-direction:column;justify-content:center;gap:.2rem;padding:.5rem .1rem .4rem;min-height:56px;font-size:.68rem;line-height:1.1;text-align:center;color:var(--trilho-txt);border-radius:5px;position:relative;font-weight:500}
.nav-item:hover{background:var(--trilho-2);color:#fff}
.nav-item[aria-current="page"]{background:var(--trilho-2);color:#fff}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-.3rem;top:8px;bottom:8px;width:3px;background:var(--trilho-acento);border-radius:0 2px 2px 0}
.nav-item svg{width:21px;height:21px}
.r-longo{display:none}
.nav-marca{position:absolute;top:3px;right:6px;margin:0;background:#C23B2F;color:#fff;font-size:.62rem;padding:0 .3rem;border-radius:8px;min-width:16px;line-height:1.35}
.nav-marca:empty{display:none}
.lateral-rodape{display:none}

/* topo */
.topo{padding:.35rem 1.2rem;min-height:3rem;gap:.7rem;background:var(--folha);border-bottom:1px solid var(--linha);flex-wrap:nowrap}
.topo-marca{display:none;font-weight:600}
.topo-busca{flex:0 1 460px;max-width:460px}
.topo-busca input{padding:.4rem 2.2rem .4rem .7rem;border:1px solid var(--linha-forte);border-radius:4px;background:var(--papel);min-height:36px;font-size:.9rem}
.topo-busca kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 .72rem var(--mono);border:1px solid var(--linha-forte);border-radius:3px;padding:0 .4rem;background:var(--folha);color:var(--tinta-2);pointer-events:none}
.busca-lista{border-radius:4px}
.icone-btn{border-radius:4px;min-width:36px;height:36px;font-weight:600;font-size:.82rem}
.grupo-acess{display:flex;gap:.2rem}
.bolinha{background:#C23B2F;border-radius:8px;font-size:.66rem;top:-5px;right:-5px}
.usuario{border-radius:4px;border-color:var(--linha)}
.avatar{background:#2F3A44;border-radius:50%;font-weight:600;font-size:.78rem;width:30px;height:30px}
.avatar.c1,.avatar.c2,.avatar.c3,.avatar.c4,.avatar.c0{background:#2F3A44}
.avatar.grande{width:56px;height:56px;font-size:1.15rem}

/* corpo */
.conteudo{padding:1.1rem 1.4rem 2.5rem;max-width:1500px}
.cabeca{margin-bottom:.9rem;padding-bottom:.65rem;border-bottom:1px solid var(--linha)}
.cabeca p{font-size:.88rem;margin-top:.15rem}
.migalha{font-size:.78rem;margin-bottom:.25rem;font-family:var(--mono)}
.migalha a{color:var(--tinta-2)}
a{color:var(--caneta)}

/* botões */
.btn{border-radius:4px;font-weight:500;font-size:.88rem;padding:.35rem .85rem;min-height:36px;background:var(--lousa);border-color:var(--lousa)}
.btn.secundario{background:var(--folha);color:var(--tinta);border-color:var(--linha-forte)}
.btn.secundario:hover{background:var(--hover-bg)}
.btn.perigo{color:#A3211A;border-color:#A3211A;background:var(--folha)}
html[data-contraste="alto"] .btn.perigo{color:#7A0C07;border-color:#7A0C07}
.btn.giz{background:var(--folha);color:var(--tinta);border:1px solid var(--tinta);box-shadow:inset 0 -3px 0 var(--giz)}
.btn.pequeno{font-weight:500;min-height:30px;padding:.15rem .6rem;font-size:.82rem}
.btn[disabled]{opacity:.45}

/* blocos */
.bloco{border-radius:4px;padding:.9rem 1rem;margin-bottom:.9rem;border-color:var(--linha)}
.bloco>h2,.bloco-cabeca h2{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:.6rem;font-weight:600}
.bloco-cabeca{align-items:center;margin-bottom:.5rem}
.bloco-cabeca h2{margin-bottom:0}
.bloco-cabeca a{font-size:.82rem}
.nota{border-radius:2px;font-size:.88rem;background:var(--caneta-clara);border-left-color:var(--caneta)}
.nota.giz{background:var(--giz-claro);border-left-color:#B58A12}
.duas{gap:.9rem}

/* etiquetas compactas */
.selo{font-size:.72rem;padding:.05rem .45rem .05rem .4rem;border-radius:3px;gap:.3rem;font-weight:600;line-height:1.5}
.selo::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.selo.azul{background:#E2EAF8;color:#17387C}
.selo.neutro{background:#E3E7EA;color:#2B343B}
.selo.roxo{background:#EBE3F6;color:#44256F}

/* tabelas densas, cabeçalho fixo */
th,td{padding:.32rem .75rem}
table.densa{font-size:.86rem}
.tabela-rolagem{border-radius:4px}
thead th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2);background:var(--cab-bg);padding:.4rem .75rem;position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--linha-forte)}
.tabela-mesa{max-height:calc(100vh - 17rem);min-height:240px;overflow:auto}
table.densa td{height:2.4rem}
table.densa td a{font-weight:500;color:var(--tinta);text-decoration:none}
table.densa td a:hover{text-decoration:underline;color:var(--caneta)}
table.densa td small{display:block;color:var(--tinta-2);font-size:.74rem;line-height:1.2}
tbody tr{cursor:default}
tbody tr:hover{background:var(--hover-bg)}
tr.foco{background:var(--foco-bg)}
tr.foco td:first-child{box-shadow:inset 3px 0 0 var(--lousa)}
.contagem{font-size:.76rem;color:var(--tinta-2);margin:.4rem .1rem 0}
.so-movel{display:none}
.miniprog{height:4px;background:var(--linha);border-radius:2px;margin-top:3px;width:84px;overflow:hidden}
.miniprog i{display:block;height:100%;background:var(--lousa)}
.pessoa a{font-weight:500}
.filtros{gap:.5rem;margin-bottom:.7rem}
.filtros label{font-size:.74rem;text-transform:none;font-weight:500}
.filtros input,.filtros select{border-radius:4px;min-height:36px;padding:.25rem .55rem;font-size:.88rem}

/* lista com resumo ao lado */
.mesa-split{display:block}
.resumo{display:none}
@media (min-width:1280px){
  .mesa-split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
  .resumo{display:block;position:sticky;top:4rem;background:var(--folha);border:1px solid var(--linha);border-top:3px solid var(--lousa);border-radius:4px;padding:.9rem 1rem}
}
.resumo h2{font-size:1.1rem;text-transform:none;letter-spacing:0;color:var(--tinta);margin:0 0 .1rem}
.resumo-tipo{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin:0 0 .3rem;font-weight:600}
.resumo-dl{margin:.7rem 0 0;display:grid;gap:.45rem}
.resumo-dl div{display:grid;grid-template-columns:7.2rem 1fr;gap:.5rem;align-items:start;border-top:1px solid var(--linha-suave);padding-top:.4rem}
.resumo-dl dt{font-size:.78rem;color:var(--tinta-2)}
.resumo-dl dd{margin:0;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.resumo-acoes{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}

/* caixa de entrada */
.caixa{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.2rem;align-items:start}
.fila-grupo{background:var(--folha);border:1px solid var(--linha);border-radius:4px;margin-bottom:.8rem;border-left:4px solid var(--c,var(--lousa))}
.g-validar{--c:#5E3796}.g-vencidas{--c:#B3261E}.g-revisoes{--c:#1F4FA8}.g-preencher{--c:#8A4F00}.g-sempei{--c:#B3261E}
.fila-cab{display:flex;align-items:baseline;gap:.6rem;padding:.45rem .85rem;background:#F5F7F8;border-bottom:1px solid var(--linha)}
.fila-cab h2{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta)}
.fila-dica{font-size:.76rem;color:var(--tinta-2)}
.fila-cab .n{margin-left:auto;font-weight:500;font-size:.85rem}
.fila-grupo ul{list-style:none;margin:0;padding:0}
.fila-item{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:.8rem;align-items:center;padding:.45rem .85rem;min-height:44px;color:var(--tinta);text-decoration:none;border-top:1px solid var(--linha-suave)}
.fila-grupo li:first-child .fila-item{border-top:0}
.fila-item:hover{background:var(--hover-bg)}
.fila-item b{display:block;font-weight:500;font-size:.9rem}
.fila-item small{display:block;color:var(--tinta-2);font-size:.78rem;line-height:1.25}
.fila-quando{font-size:.76rem;color:var(--tinta-2);white-space:nowrap}
.g-vencidas .fila-quando{color:#A3211A;font-weight:500}
.seta{color:var(--tinta-2);font-size:1.1rem}
.fila-mais{margin:0;padding:.4rem .85rem;font-size:.78rem;color:var(--tinta-2);border-top:1px solid var(--linha-suave)}
.caixa-lado .bloco{margin-bottom:.8rem}
.nums h3{font-size:.76rem;color:var(--tinta-2);margin:.8rem 0 .3rem;font-weight:600}
.nums dl,.datas ul{margin:0;padding:0;list-style:none}
.nums dl>div{display:flex;justify-content:space-between;gap:.5rem;padding:.22rem 0;border-bottom:1px dotted var(--linha);font-size:.86rem}
.nums dt{display:flex;align-items:center;gap:.4rem;min-width:0}
.nums dt a{color:var(--tinta);text-decoration:none}
.nums dt a:hover{text-decoration:underline}
.nums dd{margin:0;font-weight:500}
.ponto{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.mini{display:flex;height:5px;gap:1px;margin:.1rem 0 .35rem;border-radius:2px;overflow:hidden}
.datas li{display:flex;gap:.7rem;padding:.3rem 0;border-top:1px solid var(--linha-suave);font-size:.86rem;align-items:baseline}
.datas li:first-child{border-top:0}
.datas small{display:block;color:var(--tinta-2);font-size:.76rem}
.dia-curto{flex:none;width:2.9rem;font-weight:500}
.atalhos{list-style:none;margin:.5rem 0 0;padding:0}
.atalhos a{display:block;padding:.55rem 0;border-top:1px solid var(--linha-suave);text-decoration:none;font-weight:500;color:var(--tinta)}
.atalhos small{display:block;font-weight:400;color:var(--tinta-2)}

/* tela do PEI: dois painéis */
.mesa-pei{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1.1rem;align-items:start}
.mesa-lado{position:sticky;top:4rem;max-height:calc(100vh - 5rem);overflow-y:auto}
.mesa-lado .bloco{margin-bottom:.7rem}
.mesa-lado .resumo-dl div{grid-template-columns:6.5rem 1fr}
.prog-txt{margin:.4rem 0 0;font-size:.86rem}
.mesa-lado .miniprog{width:100%;height:5px;margin:.25rem 0 .2rem}
.acoes-pei{display:grid;gap:.4rem}
.acoes-pei .btn{width:100%;justify-content:flex-start}
.documento{border-radius:2px;box-shadow:none;margin:0;padding:2rem 2.4rem;max-width:880px;border-color:var(--linha-forte)}
.doc-cabeca{border-bottom:2px solid var(--tinta)}
.doc-secao h2{font-size:1rem;color:var(--tinta)}
.doc-secao h2 span{font-family:var(--mono);font-weight:400}
.tempo{border-left-width:2px}
.tempo h3{font-size:.9rem}

/* etapas */
.mesa-etapas{grid-template-columns:240px minmax(0,1fr);gap:1rem}
.etapas{border-radius:4px;padding:.3rem;top:4rem}
.etapas a{padding:.28rem .35rem;font-size:.84rem;gap:.5rem}
.etapas i{border-radius:4px;width:24px;height:24px;font-size:.74rem;font-weight:500}
.etapas a[aria-current="step"]{background:var(--lousa);color:#fff;font-weight:600}
.etapas a[aria-current="step"] i{background:#fff;color:var(--lousa);border-color:#fff}
.etapa-cabeca{display:flex;justify-content:space-between;align-items:baseline;gap:.7rem;margin-bottom:.8rem;padding-bottom:.55rem;border-bottom:1px solid var(--linha)}
.etapa-cabeca h2{font-size:1.1rem;letter-spacing:0;text-transform:none;color:var(--tinta);margin:0}
.etapa-cabeca .mono{font-size:.78rem;color:var(--tinta-2);white-space:nowrap}
#form-etapa{padding-bottom:0;display:flex;flex-direction:column;min-height:calc(100vh - 9rem)}
.barra-acoes{margin-top:auto!important;position:sticky;bottom:0;z-index:12;background:var(--folha);margin:1.2rem -1rem 0;padding:.65rem 1rem;border-top:1px solid var(--linha-forte);align-items:center;box-shadow:0 -6px 12px -8px rgba(20,25,30,.25)}
.barra-acoes .prog-barra{font-size:.78rem;color:var(--tinta-2);margin:0 auto 0 .8rem}
.campo label,.campo legend{font-size:.86rem;font-weight:600}
.campo input,.campo select,.campo textarea{border-radius:4px;border-color:var(--linha-forte);font-size:.92rem}
.linha-rep{border-radius:4px;background:#F7F9FA}

/* ficha, metas, calendário */
.abas a[aria-current="page"]{border-bottom-color:var(--lousa);font-weight:600}
.definicoes dt{font-size:.78rem}
.barra{height:12px;border-radius:2px}
.barra span{font-size:0}
.legenda{font-size:.86rem}
.legenda li{font-size:.86rem}
.legenda i{border-radius:2px;width:10px;height:10px}
.cal{border-radius:4px}
.cal .hoje .num{background:var(--tinta);color:#fff}
.meta-item{padding:.8rem 0}
.periodo .pilha span{border-radius:1px}

/* família: simples, uma coluna, texto grande */
.fam{max-width:760px;margin:0 auto;font-size:1.08rem;line-height:1.65}
.fam-topo{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding-bottom:1.2rem;border-bottom:3px solid var(--lousa)}
.fam-topo h1{font-size:2rem;line-height:1.15}
.fam-topo p{margin:.3rem 0 0;color:var(--tinta-2);font-size:1.02rem}
.fam-ciencia{margin:1.2rem 0 0;padding:1rem 1.2rem;background:var(--giz-claro);border-left:5px solid #B58A12;border-radius:2px;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.fam-ciencia p{margin:0}
.fam-ciencia.ok{background:#E3F2E9;border-left-color:#1A7346;display:block}
.fam .btn{min-height:46px;font-size:1rem;padding:.5rem 1.2rem}
.fam-bloco{padding:1.4rem 0;border-bottom:1px solid var(--linha)}
.fam-bloco h2{font-size:1.3rem;text-transform:none;letter-spacing:0;color:var(--tinta);margin:0 0 .5rem}
.fam-bloco p{margin:0;white-space:pre-line}
.fam-data p{display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
.fam-data b{font-size:1.5rem}
.fam-meta{padding:1rem 0;border-top:1px solid var(--linha-suave)}
.fam-meta h3{font-size:1.08rem;max-width:34ch}
.fam .selo{font-size:.85rem;padding:.12rem .6rem}

/* login */
.login-lado{background:var(--trilho);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.login-lado h1{font-weight:600;letter-spacing:-.02em}
.login-lado .marca small{color:#B4BFC8}
.login-trilha path:first-child{stroke:#6FD0D8}.login-trilha circle{fill:#6FD0D8}.login-trilha circle:nth-of-type(n+2){fill:#fff}.login-trilha path:last-child{fill:#6FD0D8;stroke:#6FD0D8}
.login .marca-nome{display:block}
.perfis button{border-radius:4px}
.login-caixa h2{font-size:1.3rem}

/* modal e avisos */
dialog{border-radius:6px}
.avisos{border-radius:4px}
.mensagem{border-radius:4px;background:var(--trilho)}

/* celular e telas médias */
@media (max-width:1100px){
  .caixa{grid-template-columns:minmax(0,1fr)}
  .mesa-pei{grid-template-columns:minmax(0,1fr)}
  .mesa-lado{position:static;max-height:none;order:-1}
  .mesa-etapas{grid-template-columns:minmax(0,1fr)}
  .etapas{position:sticky;top:0;z-index:15;display:flex;overflow-x:auto;gap:.15rem;padding:.25rem;border-radius:0;box-shadow:0 4px 8px -6px rgba(20,25,30,.3)}
  .etapas a{min-width:44px;min-height:44px;justify-content:center}
  .etapas a[aria-current="step"]{padding:.3rem .7rem}
}
@media (max-width:860px){
  :root{--lateral:0}
  body{font-size:1rem}
  .lateral{padding:.8rem .6rem 1rem;height:100vh;top:0;gap:.5rem}
  .lateral .marca{flex-direction:row;justify-content:flex-start;padding:.2rem .4rem .8rem;gap:.7rem}
  .marca-nome{display:block}
  .marca-nome b{font-size:1.05rem;font-weight:600}
  .marca-nome small{font-size:.75rem}
  .nav-item{flex-direction:row;justify-content:flex-start;gap:.8rem;padding:.6rem .8rem;min-height:48px;font-size:.98rem;text-align:left}
  .nav-item[aria-current="page"]::before{left:0}
  .r-curto{display:none}.r-longo{display:inline}

function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }
function gravar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) { /* sem armazenamento: segue em memória */ } }
function carregar() {

/* Peças de formulário */
function campo({ nome, rotulo, valor = '', tipo = 'text', largo, ajuda, req, opcoes, erro, placeholder }) {
  const id = 'c-' + nome.replace(/\W/g, '-');
  const obrig = req ? ' required aria-required="true"' : '';
  const descr = ajuda ? ` aria-describedby="${id}-a"` : '';
  let controle;
  if (tipo === 'textarea') controle = `<textarea id="${id}" name="${h(nome)}"${obrig}${descr} placeholder="${h(placeholder || '')}">${h(valor)}</textarea>`;
  else if (tipo === 'select') controle = `<select id="${id}" name="${h(nome)}"${obrig}${descr}>${opcoes.map(o => `<option value="${h(o[0])}" ${String(o[0]) === String(valor) ? 'selected' : ''}>${h(o[1])}</option>`).join('')}</select>`;
  else controle = `<input id="${id}" name="${h(nome)}" type="${tipo}" value="${h(valor)}"${obrig}${descr} placeholder="${h(placeholder || '')}">`;
  return `<div class="campo ${largo ? 'largo' : ''} ${erro ? 'invalido' : ''}"><label for="${id}">${h(rotulo)}${req ? ' (obrigatório)' : ''}</label>${controle}${ajuda ? `<small id="${id}-a">${h(ajuda)}</small>` : ''}${erro ? `<span class="erro">${h(erro)}</span>` : ''}</div>`;
}
function marcas(nome, rotulo, lista, selecionados) {
  const sel = selecionados || [];
  return `<fieldset class="campo largo" data-grupo="${h(nome)}"><legend>${h(rotulo)}</legend><div class="marcas">${lista.map(item => {
    const valor = Array.isArray(item) ? item[0] : item, texto = Array.isArray(item) ? item[1] : item;
    return `<label><input type="checkbox" name="${h(nome)}" value="${h(valor)}" ${sel.includes(valor) ? 'checked' : ''}> ${h(texto)}</label>`;
  }).join('')}</div></fieldset>`;
}

const avatar = (nome, id, grande) => `<span class="avatar ${corAvatar(id)} ${grande ? 'grande' : ''}" aria-hidden="true">${h(iniciais(nome))}</span>`;

function prazoTexto(iso) {
  const n = diasAte(iso);
  if (n < 0) return `Venceu há ${-n} ${-n === 1 ? 'dia' : 'dias'}`;
  if (n === 0) return 'Vence hoje';
  return `Faltam ${n} ${n === 1 ? 'dia' : 'dias'}`;
}

/* Trilha da meta: cada registro é um passo entre o início e a bandeira do prazo. */
function trilha(m, simples) {
  const fimRegistros = m.registros.length ? m.registros[m.registros.length - 1].data : m.inicio;
  const ini = new Date(m.inicio).getTime();
  const fim = Math.max(new Date(m.prazo).getTime(), HOJE.getTime(), new Date(fimRegistros).getTime());
  const pos = iso => Math.min(100, Math.max(0, (new Date(iso).getTime() - ini) / (fim - ini) * 100));
  const posHoje = pos(dia(0));
  const feita = m.registros.length ? pos(fimRegistros) : 0;
  const cor = STATUS_META[m.status].hex;
  const passos = m.registros.map((r, i) => `<span class="trilha-passo" style="left:${pos(r.data)}%;border-color:${STATUS_META[r.status].hex};color:${STATUS_META[r.status].hex}" title="${h(fmt(r.data) + ': ' + r.atividade)}">${simples ? '' : i + 1}</span>`).join('');
  const alcancada = m.status === 'alcancada';
  const bandeira = `<svg class="trilha-bandeira" style="left:calc(${pos(m.prazo)}% - 6px);right:auto" viewBox="0 0 26 30" aria-hidden="true"><path d="M5 2v26" stroke="#14201C" stroke-width="2.4" stroke-linecap="round"/><path d="M6 3h16l-4 5 4 5H6z" fill="${alcancada ? '#1A7346' : '#F4C430'}" stroke="#14201C" stroke-width="1.4"/></svg>`;
  const rotulo = `Trilha da meta: ${m.registros.length} registros de acompanhamento, situação ${STATUS_META[m.status].nome}, prazo em ${fmt(m.prazo)}.`;
  return `<div role="img" aria-label="${h(rotulo)}"><div class="trilha"><div class="trilha-linha"></div><div class="trilha-feita" style="width:${feita}%;background:${cor}"></div>${passos}<div class="trilha-hoje" style="left:${posHoje}%"></div>${bandeira}</div>
    <div class="trilha-datas"><span>Início ${fmt(m.inicio)}</span><span>Prazo ${fmt(m.prazo)}</span></div></div>`;
}

function barra(partes) {
  const total = partes.reduce((s, p) => s + p.n, 0) || 1;
  return `<div class="barra" aria-hidden="true">${partes.filter(p => p.n).map(p => `<span style="flex:${p.n / total};background:${p.hex}">${p.n}</span>`).join('')}</div>
    <ul class="legenda">${partes.map(p => `<li><i style="background:${p.hex}"></i>${p.link ? `<a href="${p.link}">${h(p.nome)}</a>` : h(p.nome)}<b>${p.n}</b></li>`).join('')}</ul>`;
}

function avisos() {
  const lista = [], dias = S.config.diasAlerta;
  if (pode('verPei')) {
    metasVisiveis().filter(m => m.status !== 'alcancada').forEach(m => {
      const n = diasAte(m.prazo), p = pei(m.pei), a = aluno(p.aluno);
      if (n < 0) lista.push({ tipo: 'alerta', texto: `Meta vencida de ${a.nome}`, detalhe: m.objetivo, link: `#/metas/${m.id}`, ordem: n });
      else if (n <= dias && p.status !== 'validacao') lista.push({ tipo: 'prazo', texto: `Meta perto do prazo de ${a.nome}`, detalhe: `${m.objetivo}. ${prazoTexto(m.prazo)}.`, link: `#/metas/${m.id}`, ordem: n });
    });
    peisVisiveis().filter(p => p.status === 'ativo' || p.status === 'revisao').forEach(p => {
      const n = diasAte(p.proximaRevisao);
      if (n <= dias) lista.push({ tipo: n < 0 ? 'alerta' : 'prazo', texto: `Revisão do PEI de ${aluno(p.aluno).nome}`, detalhe: n < 0 ? `Atrasada desde ${fmt(p.proximaRevisao)}` : `Marcada para ${fmt(p.proximaRevisao)}`, link: `#/peis/${p.id}`, ordem: n });
    });
  }
  if (pode('validarPei')) peisVisiveis().filter(p => p.status === 'validacao').forEach(p => lista.push({ tipo: 'validar', texto: `Validar o PEI de ${aluno(p.aluno).nome}`, detalhe: 'Plano enviado pela equipe', link: `#/peis/${p.id}`, ordem: -50 }));
  if (pode('editarPei')) {
    alunosVisiveis().filter(a => !peiDoAluno(a.id)).forEach(a => lista.push({ tipo: 'pendencia', texto: `${a.nome} ainda não tem PEI`, detalhe: 'Comece o plano pela ficha do estudante', link: `#/estudantes/${a.id}`, ordem: 3 }));
    peisVisiveis().filter(p => p.status === 'elaboracao').forEach(p => {
      const falta = ETAPAS.filter((_, i) => i < 11 && !etapaCompleta(p, i + 1)).length;
      lista.push({ tipo: 'pendencia', texto: `PEI de ${aluno(p.aluno).nome} incompleto`, detalhe: `${falta} etapas por preencher`, link: `#/peis/${p.id}/etapa/1`, ordem: 4 });
    });
  }
  return lista.sort((a, b) => a.ordem - b.ordem);
}

function etapaCompleta(p, n) {
  const e = p.e;
  switch (n) {
    case 1: return !!(e.periodo && e.contexto);
    case 2: return !!(e.leitura && e.matematica && e.convivencia && e.autonomia);
    case 3: return !!(e.potencialidades && e.interesses && e.habilidades);
    case 4: return !!((e.barreiras || []).length && e.barreirasTexto);
    case 5: return !!(e.objetivoGeral && e.objetivos);
    case 6: { const ms = metasDoPei(p.id); return ms.length > 0 && ms.every(m => m.objetivo && m.prazo); }
    case 7: return !!e.estrategias;
    case 8: return !!((e.adaptacoes || []).length || (e.recursos || []).length);
    case 9: return p.acoes.length > 0;
    case 10: return !!e.indicadores;
    case 11: return !!(e.combinados && e.reuniao);
    default: return p.status === 'ativo';
  }
}

const acessoPei = p => {

function documentoPei(p, emissao) {

    ${secao(1, `<p>${h(e.contexto)}</p><p class="sutil">Início do plano: ${fmt(e.inicio)}. Equipe: ${a.vinculos.map(nomeProf).map(h).join(', ')}.</p>`)}

    ${secao(3, `<dl class="definicoes um"><div><dt>Potencialidades</dt><dd>${h(e.potencialidades)}</dd></div><div><dt>Interesses</dt><dd>${h(e.interesses)}</dd></div><div><dt>Habilidades</dt><dd>${h(e.habilidades)}</dd></div></dl>`)}
    ${restrito ? '' : secao(4, `${txt(e.barreirasTexto)}${itens(e.barreiras)}`)}
    ${secao(5, `${txt(e.objetivoGeral)}${e.objetivos ? itens(e.objetivos.split('\n')) : ''}`)}

    ${secao(7, e.estrategias ? itens(e.estrategias.split('\n')) : '<p class="sutil">Não preenchido.</p>')}

    ${secao(9, p.acoes.length ? `<div class="tabela-rolagem"><table class="doc-tabela"><thead><tr><th>Ação</th><th>Responsável</th><th>Prazo</th></tr></thead><tbody>${p.acoes.map(x => `<tr><td>${h(x.acao)}</td><td>${h(nomeProf(x.responsavel))}</td><td>${fmt(x.prazo)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="sutil">Não preenchido.</p>')}
    ${secao(10, e.indicadores ? itens(e.indicadores.split('\n')) : '<p class="sutil">Não preenchido.</p>')}
    ${secao(11, `${txt(e.combinados)}<p class="sutil">Reunião com a família: ${fmt(e.reuniao)}. Ciência da família: ${p.ciencia ? fmt(p.ciencia) : 'ainda não registrada'}.</p>`)}

const opcoesEquipe = a => [['', 'Escolha'], ...a.vinculos.concat(['p1']).filter((v, i, l) => l.indexOf(v) === i).map(v => [v, nomeProf(v)])];

function telaEtapa(id, nTexto) {

  const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length;
  return `${cabeca(`PEI de ${a.nome}`, '', `<a class="btn secundario" href="#/peis/${p.id}" data-a="sairEtapa" data-id="${p.id}" data-n="${n}">Salvar e ver o plano</a>`, `<a href="#/peis">PEIs</a> / <a href="#/peis/${p.id}">${h(a.nome)}</a> / Etapa ${n}`)}

function blocoMeta(m) {

function listaMetas() {

function graficoPeriodos() {
  const meses = [3, 2, 1, 0].map(n => { const d = new Date(HOJE); d.setDate(1); d.setMonth(d.getMonth() - n); return d.toISOString().slice(0, 7); });
  const nomes = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const regs = metasVisiveis().flatMap(m => m.registros);
  const dados = meses.map(mes => ({ mes, porStatus: Object.keys(STATUS_META).map(k => ({ k, n: regs.filter(r => r.data.startsWith(mes) && r.status === k).length })) }));
  const maior = Math.max(1, ...dados.map(d => d.porStatus.reduce((s, x) => s + x.n, 0)));
  return `<div class="periodos" role="img" aria-label="Registros de acompanhamento nos últimos quatro meses">${dados.map(d => { const total = d.porStatus.reduce((s, x) => s + x.n, 0); return `<div class="periodo"><div class="pilha">${d.porStatus.filter(x => x.n).map(x => `<span style="height:${x.n / maior * 100}%;background:${STATUS_META[x.k].hex}"></span>`).join('')}</div><p><b>${total}</b> em ${nomes[+d.mes.slice(5) - 1]}</p></div>`; }).join('')}</div>`;
}

function telaCalendario() {
  if (!pode('verCalendario')) { auditar('Acesso negado', 'Tentou abrir o calendário'); return semAcesso(); }
  const base = new Date(HOJE.getFullYear(), HOJE.getMonth() + F.mes, 1), ano = base.getFullYear(), mes = base.getMonth();
  const mesAno = base.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }), nome = mesAno[0].toUpperCase() + mesAno.slice(1);
  const inicio = new Date(ano, mes, 1 - base.getDay()), dias = [];
  for (let i = 0; i < 42; i++) { const d = new Date(inicio); d.setDate(inicio.getDate() + i); dias.push(d); }
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const eventos = S.eventos.filter(e => !e.aluno || alunoVisivel(e.aluno));
  const rotulo = e => e.aluno ? `${e.titulo}: ${aluno(e.aluno).nome.split(' ')[0]}` : e.titulo;
  const link = e => e.aluno ? `#/estudantes/${e.aluno}` : '#/calendario';
  const doMes = eventos.filter(e => e.data.startsWith(`${ano}-${String(mes + 1).padStart(2, '0')}`)).sort((a, b) => a.data.localeCompare(b.data));
  return `${cabeca('Calendário de revisões', 'Revisões de PEI, reuniões com famílias e prazos da equipe.', pode('editarPei') || pode('verGestao') ? '<button class="btn" data-a="modalEvento">Marcar data</button>' : '')}
  <div class="bloco-cabeca"><h2>${h(nome)}</h2><div class="cabeca-acoes"><button class="btn secundario pequeno" data-a="mes" data-d="-1">Mês anterior</button><button class="btn secundario pequeno" data-a="mes" data-d="0">Hoje</button><button class="btn secundario pequeno" data-a="mes" data-d="1">Próximo mês</button></div></div>
  <div class="cal nao-leitor" aria-hidden="true">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(d => `<div class="dia-semana">${d}</div>`).join('')}${dias.map(d => `<div class="${d.getMonth() !== mes ? 'fora' : ''} ${iso(d) === dia(0) ? 'hoje' : ''}"><span class="num">${d.getDate()}</span>${eventos.filter(e => e.data === iso(d)).map(e => `<a class="${e.tipo}" href="${link(e)}" tabindex="-1">${h(rotulo(e))}</a>`).join('')}</div>`).join('')}</div>
  <section class="bloco" style="margin-top:1.1rem"><h2>Datas deste mês</h2>${doMes.length ? `<ul class="lista">${doMes.map(e => `<li><div class="texto"><a href="${link(e)}">${h(e.titulo)}${e.aluno ? ' de ' + h(aluno(e.aluno).nome) : ''}</a><small>${fmt(e.data)}</small></div></li>`).join('')}</ul>` : '<p class="sutil">Nenhuma data neste mês.</p>'}</section>`;
}

function conteudo() {
  const [caminho] = (location.hash || '#/').slice(2).split('?');
  const [r, a, b, c] = caminho.split('/');
  switch (r) {
    case 'painel': return pode('verPainel') ? telaPainel() : semAcesso();
    case 'estudantes':
      if (!pode('verEstudantes')) { auditar('Acesso negado', 'Tentou abrir a lista de estudantes'); return semAcesso('A família vê só o plano compartilhado.'); }
      if (!a) return telaEstudantes();
      if (a === 'novo') return telaFormEstudante();
      if (b === 'editar') return telaFormEstudante(a);
      return telaEstudante(a, b);
    case 'peis': if (!a) return telaPeis(); return b === 'etapa' ? telaEtapa(a, c) : telaPei(a);
    case 'acompanhamento': return telaAcompanhamento();
    case 'metas': return telaMeta(a);
    case 'relatorios': return telaRelatorios();
    case 'gestao': return telaGestao(a);
    case 'calendario': return telaCalendario();
    case 'seguranca': return telaSeguranca(a);
    case 'familia': return telaFamilia();
    default: location.replace(sessao.perfil === 'familia' ? '#/familia' : '#/painel'); return '';
  }
}

/* Guarda a etapa aberta no plano antes de sair dela. */
function capturarEtapa(id) {
  const form = document.getElementById('form-etapa'); if (!form) return;
  const p = pei(id);
  form.querySelectorAll('[data-grupo]').forEach(g => { p.e[g.dataset.grupo] = []; });
  new FormData(form).forEach((valor, nome) => {
    if (nome.startsWith('m:')) { const [, mid, c] = nome.split(':'); const m = S.metas.find(x => x.id === mid); if (m) m[c] = valor; return; }
    if (nome.startsWith('a:')) { const [, i, c] = nome.split(':'); p.acoes[+i][c] = valor; return; }
    if (nome === 'proximaRevisao') { p.proximaRevisao = valor; return; }
    if (form.querySelector(`[data-grupo="${nome}"]`)) { p.e[nome].push(valor); return; }
    p.e[nome] = valor;
  });
  salvar();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (el && ACOES[el.dataset.a] && !el.disabled) {
    if (el.tagName === 'A' || el.type !== 'submit') ev.preventDefault();
    ACOES[el.dataset.a](el.dataset, el);
    return;
  }
  const aberto = document.querySelector('.avisos');
  if (aberto && !ev.target.closest('.ancora')) document.getElementById('painel-avisos').innerHTML = '';
});
document.addEventListener('submit', ev => {
  const form = ev.target, nome = form.dataset.f;
  if (!FORMS[nome]) { ev.preventDefault(); return; }
  ev.preventDefault();
  if (!form.noValidate && !form.reportValidity()) return;
  FORMS[nome](new FormData(form), form);
});
document.addEventListener('input', ev => {
  const alvo = ev.target;
  if (alvo.dataset.filtro) {
    const [g, c] = alvo.dataset.filtro.split('.'); F[g][c] = alvo.value;
    const r = document.getElementById('resultado'); if (r) r.innerHTML = RESULTADOS[r.dataset.res]();

  if (alvo.id === 'busca-geral') {
    const b = alvo.value.trim().toLowerCase(), caixa = document.getElementById('busca-resultado');
    if (!b) { caixa.innerHTML = ''; return; }
    const lista = alunosVisiveis().filter(a => a.nome.toLowerCase().includes(b)).slice(0, 6);
    caixa.innerHTML = `<div class="busca-lista">${lista.map(a => `<a href="#/estudantes/${a.id}">${h(a.nome)} <small class="sutil">${h(turma(a.turma).nome)}</small></a>`).join('') || '<p class="sutil" style="margin:.3rem .5rem">Nenhum estudante encontrado.</p>'}</div>`;
  }
});

});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { const l = document.getElementById('lateral'); if (l && l.classList.contains('aberta')) ACOES.fecharMenu(); const p = document.getElementById('painel-avisos'); if (p) p.innerHTML = ''; }
});
window.addEventListener('hashchange', () => { aplicarConsulta(); render(); });


/* Variante B, MESA: ferramenta de trabalho da coordenação. A pergunta da tela é "o que preciso resolver agora?" */
const mono = v => `<span class="mono">${h(v)}</span>`;
const dm = iso => iso ? mono(fmt(iso)) : 'Sem data';
const dcurta = iso => { const [, m, d] = iso.split('-'); return `${d}/${m}`; };
const miniProg = (n, t) => `<div class="miniprog" aria-hidden="true"><i style="width:${Math.round(n / t * 100)}%"></i></div>`;
const FOCO = { est: '', pei: '' };

/* Trilho de navegação: ícone com rótulo curto embaixo. Na gaveta do celular vira lista com nome completo. */
function navegacao() {
  const pend = pode('verPainel') ? avisos().length : 0;
  const item = (rota, curto, longo, ic, marca) => {
    const atual = (location.hash || '').startsWith('#/' + rota);
    return `<li><a class="nav-item" href="#/${rota}" ${atual ? 'aria-current="page"' : ''}>${icone(ic)}<span class="r-curto">${curto}</span><span class="r-longo">${longo}</span>${marca ? `<span class="nav-marca mono">${marca}</span>` : ''}</a></li>`;
  };
  const itens = [
    pode('verPainel') && item('painel', 'Caixa', 'Caixa de entrada', 'painel', pend || ''),
    pode('verFamilia') && item('familia', 'Plano', 'Plano do estudante', 'pei'),
    pode('verEstudantes') && item('estudantes', 'Estudantes', 'Estudantes', 'estudantes'),
    pode('verPei') && item('peis', 'PEIs', 'PEIs', 'pei'),
    pode('verPei') && item('acompanhamento', 'Metas', 'Acompanhamento', 'metas'),
    pode('verRelatorios') && item('relatorios', 'Relatórios', 'Relatórios', 'relatorios'),
    pode('verCalendario') && item('calendario', 'Agenda', 'Calendário de revisões', 'calendario'),
    pode('verGestao') && item('gestao', 'Escola', 'Gestão escolar', 'gestao'),
    (pode('verSeguranca') || pode('verAuditoria')) && item('seguranca', 'Acesso', 'Usuários e auditoria', 'seguranca'),
  ].filter(Boolean).join('');
  return `<a class="marca" href="#/${sessao.perfil === 'familia' ? 'familia' : 'painel'}" aria-label="PEI Escolar, início">${SINAL}<span class="marca-nome"><b>PEI Escolar</b><small>Mesa da coordenação</small></span></a>
  <nav aria-label="Menu principal"><ul class="nav-grupo">${itens}</ul></nav><div class="lateral-rodape">${h(S.escola.nome)}<br>Ano letivo ${h(S.anoLetivo.ano)}</div>`;
}
function barraTopo() {
  const u = usuario(), lista = avisos();
  return `<button class="icone-btn btn-menu" data-a="menu" aria-label="Abrir menu">${icone('menu')}</button><span class="topo-marca">PEI Escolar</span>
  ${sessao.perfil !== 'familia' ? `<div class="topo-busca"><label class="so-leitor" for="busca-geral">Buscar estudante. Atalho: tecla barra</label><input id="busca-geral" type="search" placeholder="Buscar estudante" autocomplete="off"><kbd aria-hidden="true">/</kbd><div id="busca-resultado"></div></div>` : ''}
  <div class="topo-direita"><div role="group" aria-label="Acessibilidade" class="grupo-acess"><button class="icone-btn" data-a="fonte" data-d="-1" aria-label="Diminuir o texto">A-</button><button class="icone-btn" data-a="fonte" data-d="1" aria-label="Aumentar o texto">A+</button><button class="icone-btn" data-a="contraste" aria-label="Alto contraste" aria-pressed="${document.documentElement.dataset.contraste === 'alto'}">${icone('contraste')}</button></div>
    <div class="ancora"><button class="icone-btn" data-a="avisos" aria-label="Avisos: ${lista.length}" aria-expanded="false">${icone('sino')}${lista.length ? `<span class="bolinha mono">${lista.length}</span>` : ''}</button><div id="painel-avisos"></div></div>
    <button class="usuario" data-a="trocarPerfil" aria-label="Trocar de perfil. Agora: ${h(u.nome)}, ${h(PERFIS[sessao.perfil])}">${avatar(u.nome, u.id)}<span class="nome-usuario">${h(u.nome)}<small>${h(PERFIS[sessao.perfil])}</small></span></button></div>`;
}
function faixa() {
  return `<div class="faixa" data-casca><span>Protótipo com dados fictícios. O que você altera fica só neste navegador.</span><button data-a="guia">Como usar</button><button data-a="restaurar">Restaurar dados</button></div>`;
}

/* Caixa de entrada: fila de pendências à esquerda, números e datas à direita. */
function telaPainel() {
  const u = usuario(), ps = peisVisiveis(), ms = metasVisiveis(), dias = S.config.diasAlerta;
  const admin = sessao.perfil === 'admin';
  const contar = st => ps.filter(p => p.status === st).length;
  const metaCont = st => ms.filter(m => m.status === st).length;
  const revisoes = ps.filter(p => (p.status === 'ativo' || p.status === 'revisao') && diasAte(p.proximaRevisao) <= dias).length;
  const perto = ms.filter(m => m.status !== 'alcancada' && diasAte(m.prazo) <= dias).length;
  const eventos = S.eventos.filter(e => diasAte(e.data) >= 0 && (!e.aluno || alunoVisivel(e.aluno))).sort((a, b) => a.data.localeCompare(b.data)).slice(0, 6);
  const lista = avisos(), semPei = a => a.tipo === 'pendencia' && a.texto.endsWith('ainda não tem PEI');
  const grupos = [
    ['validar', 'Validar', 'plano esperando a coordenação', a => a.tipo === 'validar'],
    ['vencidas', 'Vencidas', 'prazo ou revisão que já passou', a => a.tipo === 'alerta'],
    ['revisoes', 'Revisões e prazos perto', 'chega em até ' + dias + ' dias', a => a.tipo === 'prazo'],
    ['preencher', 'Para preencher', 'plano incompleto', a => a.tipo === 'pendencia' && !semPei(a)],
    ['sempei', 'Sem PEI', 'estudante sem plano', semPei],
  ];
  const quando = a => a.tipo === 'alerta' ? `${-a.ordem} d atrás` : a.tipo === 'prazo' ? (a.ordem === 0 ? 'hoje' : `em ${a.ordem} d`) : '';
  const fila = grupos.map(([k, nome, dica, teste]) => {
    const itens = lista.filter(teste); if (!itens.length) return '';
    return `<section class="fila-grupo g-${k}" aria-labelledby="g-${k}"><div class="fila-cab"><h2 id="g-${k}">${nome}</h2><span class="fila-dica">${dica}</span><span class="n mono">${itens.length}</span></div>
      <ul>${itens.slice(0, 6).map(a => `<li><a class="fila-item" href="${a.link}"><span><b>${h(a.texto)}</b><small>${h(a.detalhe)}</small></span><span class="fila-quando mono">${quando(a)}</span><span class="seta" aria-hidden="true">›</span></a></li>`).join('')}</ul>
      ${itens.length > 6 ? `<p class="fila-mais">Mais ${itens.length - 6} ${itens.length - 6 === 1 ? 'item' : 'itens'} neste grupo. Veja todos em Avisos, no sino do topo.</p>` : ''}</section>`;
  }).join('');
  const dot = hex => `<i class="ponto" style="background:${hex}" aria-hidden="true"></i>`;
  const linha = (nome, n, hex, link) => `<div><dt>${hex ? dot(hex) : ''}${link ? `<a href="${link}">${h(nome)}</a>` : h(nome)}</dt><dd class="mono">${n}</dd></div>`;
  const mini = partes => { const t = partes.reduce((s, p) => s + p.n, 0) || 1; return `<div class="mini" aria-hidden="true">${partes.filter(p => p.n).map(p => `<span style="flex:${p.n / t};background:${p.hex}"></span>`).join('')}</div>`; };
  const pPartes = Object.entries(STATUS_PEI).map(([k, s]) => ({ n: contar(k), hex: s.hex }));
  const mOrdem = ['alcancada', 'andamento', 'replanejar', 'nao_iniciada'], mNome = { alcancada: 'Alcançadas', andamento: 'Em andamento', replanejar: 'Para replanejar', nao_iniciada: 'Pendentes' };
  const mPartes = mOrdem.map(k => ({ n: metaCont(k), hex: STATUS_META[k].hex }));
  const numeros = `<aside class="caixa-lado" aria-label="Números da escola">
    <section class="bloco nums"><h2>Números da escola</h2>
      <dl>${linha('Estudantes acompanhados', alunosVisiveis().length, '', '#/estudantes')}</dl>
      <h3>PEIs por situação</h3>${mini(pPartes)}
      <dl>${Object.entries(STATUS_PEI).map(([k, s]) => linha(s.nome, contar(k), s.hex, admin ? null : `#/peis?status=${k}`)).join('')}</dl>
      <h3>Metas</h3>${mini(mPartes)}
      <dl>${mOrdem.map(k => linha(mNome[k], metaCont(k), STATUS_META[k].hex, admin ? null : `#/acompanhamento?status=${k}`)).join('')}</dl>
      <h3>Atenção</h3>
      <dl>${linha('Revisões pendentes', revisoes, '', admin ? '#/calendario' : '#/peis?rev=pendente')}${linha('Metas com prazo perto ou vencido', perto, '', admin ? '#/calendario' : '#/acompanhamento?prazo=perto')}</dl>
    </section>
    <section class="bloco datas"><div class="bloco-cabeca"><h2>Próximas datas</h2><a href="#/calendario">Calendário</a></div>
      ${eventos.length ? `<ul>${eventos.map(e => { const a = e.aluno && aluno(e.aluno); return `<li><span class="mono dia-curto">${dcurta(e.data)}</span><span>${h(e.titulo)}<small>${a ? h(a.nome) : 'Toda a equipe'}</small></span></li>`; }).join('')}</ul>` : '<p class="sutil">Nenhuma data marcada.</p>'}</section></aside>`;
  const esq = admin
    ? `<section class="bloco"><h2>Cadastros</h2><p class="sutil">Você vê números e cadastros. O conteúdo pedagógico dos planos fica com a equipe.</p><ul class="atalhos"><li><a href="#/estudantes">Estudantes<small>Fichas e cadastro</small></a></li><li><a href="#/gestao">Gestão escolar<small>Turmas, profissionais e associações</small></a></li><li><a href="#/calendario">Calendário<small>Revisões e reuniões</small></a></li><li><a href="#/seguranca">Usuários e auditoria<small>Quem acessa e o que ficou registrado</small></a></li></ul></section>`
    : (fila || '<section class="bloco vazio"><p>Caixa vazia. Nada pede ação agora.</p></section>');
  const hora = new Date().getHours(), saud = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  const sub = admin ? `${S.escola.nome}, ano letivo ${S.anoLetivo.ano}.` : `${saud}, ${u.nome.split(' ')[0]}. ${lista.length ? `${lista.length} ${lista.length === 1 ? 'item espera' : 'itens esperam'} por você.` : 'Nada esperando por você.'}`;
  return `${cabeca('Caixa de entrada', sub)}<div class="caixa"><div class="caixa-fila">${esq}</div>${numeros}</div>`;
}

/* Painel de resumo do item em foco, ao lado das listas largas. */
function resumoEstudante(id) {
  const a = aluno(id); if (!a) return '';
  const p = peiDoAluno(id), t = turma(a.turma), verPei = pode('verPei');
  const feitas = p && verPei ? ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length : 0;
  return `<p class="resumo-tipo">Em foco</p><h2>${h(a.nome)}</h2><p class="mono sutil">Matrícula ${h(a.matricula)}</p>
  <dl class="resumo-dl"><div><dt>Turma</dt><dd>${h(t.nome)}, ${h(t.turno.toLowerCase())}</dd></div><div><dt>Família</dt><dd>${h(a.responsavel)}</dd></div><div><dt>PEI</dt><dd>${seloPei(p)}</dd></div>
  ${p && verPei ? `<div><dt>Etapas</dt><dd><span class="mono">${feitas}/12</span>${miniProg(feitas, 12)}</dd></div><div><dt>Próxima revisão</dt><dd>${dm(p.proximaRevisao)}</dd></div>` : ''}
  <div><dt>Equipe</dt><dd>${a.vinculos.map(nomeProf).map(h).join(', ') || 'Nenhuma'}</dd></div></dl>
  <div class="resumo-acoes"><a class="btn" href="#/estudantes/${a.id}">Abrir ficha</a>${p && verPei ? `<a class="btn secundario" href="#/peis/${p.id}">Abrir PEI</a>` : ''}</div>`;
}
function resumoPei(pid) {
  const p = pei(pid); if (!p) return '';
  const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length;
  return `<p class="resumo-tipo">Em foco</p><h2>${h(a.nome)}</h2><p class="sutil">${h(turma(a.turma).nome)}</p>
  <dl class="resumo-dl"><div><dt>Situação</dt><dd>${seloPei(p)}</dd></div><div><dt>Etapas</dt><dd><span class="mono">${feitas}/12</span>${miniProg(feitas, 12)}</dd></div><div><dt>Versão</dt><dd>${p.versoes.length ? mono('v' + p.versoes.length) : 'Rascunho'}</dd></div><div><dt>Próxima revisão</dt><dd>${dm(p.proximaRevisao)}</dd></div></dl>
  <div class="resumo-acoes"><a class="btn" href="#/peis/${p.id}">Abrir PEI</a><a class="btn secundario" href="#/estudantes/${a.id}">Abrir ficha</a></div>`;
}
function atualizarResumo() {
  const box = document.getElementById('resumo'), res = document.getElementById('resultado'); if (!box || !res) return;
  const tipo = res.dataset.res, linhas = [...res.querySelectorAll('[data-item]')];
  const alvo = linhas.find(l => l.dataset.id === FOCO[tipo]) || linhas[0];
  linhas.forEach(l => l.classList.toggle('foco', l === alvo));
  box.innerHTML = alvo ? (tipo === 'est' ? resumoEstudante(alvo.dataset.id) : resumoPei(alvo.dataset.id)) : '<p class="sutil">Nenhum item em foco.</p>';
}

/* Estudantes */
function tabelaEstudantes() {
  const f = F.est, b = f.busca.toLowerCase();
  const lista = alunosVisiveis().filter(a => (!b || a.nome.toLowerCase().includes(b) || a.matricula.includes(b)) && (!f.turma || a.turma === f.turma) && (!f.sit || (f.sit === 'sem' ? !peiDoAluno(a.id) : (peiDoAluno(a.id) || {}).status === f.sit)));
  setTimeout(atualizarResumo, 0);
  if (!lista.length) return `<div class="bloco vazio"><p>Nenhum estudante encontrado com esses filtros.</p><button class="btn secundario" data-a="limparFiltros" data-g="est">Limpar filtros</button></div>`;
  const verPei = pode('verPei');
  return `<div class="tabela-rolagem tabela-mesa"><table class="densa"><caption class="so-leitor">Estudantes</caption><thead><tr><th scope="col">Estudante</th><th scope="col" class="so-larga">Turma</th><th scope="col">PEI</th><th scope="col">Próxima revisão</th></tr></thead><tbody>
  ${lista.map(a => { const p = peiDoAluno(a.id); return `<tr data-item="estudante" data-id="${a.id}"><td><a href="#/estudantes/${a.id}">${h(a.nome)}</a><small class="mono">${h(a.matricula)}<span class="so-movel"> · ${h(turma(a.turma).nome)}</span></small></td><td class="so-larga">${h(turma(a.turma).nome)}</td><td>${seloPei(p)}</td><td>${p && verPei ? dm(p.proximaRevisao) : p ? 'Com a equipe' : 'Sem data'}</td></tr>`; }).join('')}
  </tbody></table></div><p class="contagem mono">${lista.length} ${lista.length === 1 ? 'estudante' : 'estudantes'}</p>`;
}
function telaEstudantes() {
  const turmas = [...new Set(alunosVisiveis().map(a => a.turma))];
  return `${cabeca('Estudantes', sessao.perfil === 'admin' || sessao.perfil === 'coord' ? 'Todos os estudantes acompanhados pela escola.' : 'Só aparecem os estudantes com vínculo com você.', pode('editarEstudante') ? '<a class="btn" href="#/estudantes/novo">Cadastrar estudante</a>' : '')}
  <div class="filtros filtros-mesa"><label class="cresce">Pesquisar por nome ou matrícula<input type="search" data-filtro="est.busca" value="${h(F.est.busca)}" placeholder="Tecle / para buscar"></label>
    <label>Turma<select data-filtro="est.turma"><option value="">Todas</option>${turmas.map(t => `<option value="${t}" ${F.est.turma === t ? 'selected' : ''}>${h(turma(t).nome)}</option>`).join('')}</select></label>
    <label>Situação do PEI<select data-filtro="est.sit"><option value="">Todas</option>${Object.entries(STATUS_PEI).map(([k, s]) => `<option value="${k}" ${F.est.sit === k ? 'selected' : ''}>${s.nome}</option>`).join('')}<option value="sem" ${F.est.sit === 'sem' ? 'selected' : ''}>Sem PEI</option></select></label></div>
  <div class="mesa-split"><div id="resultado" data-res="est">${tabelaEstudantes()}</div><aside class="resumo nao-imprimir" id="resumo" aria-label="Resumo do estudante em foco"></aside></div>`;
}

/* PEIs */
function tabelaPeis() {
  const f = F.pei, b = f.busca.toLowerCase();
  const lista = peisVisiveis().filter(p => { const a = aluno(p.aluno); return (!b || a.nome.toLowerCase().includes(b)) && (!f.status || p.status === f.status) && (!f.rev || ((p.status === 'ativo' || p.status === 'revisao') && diasAte(p.proximaRevisao) <= S.config.diasAlerta)); });
  setTimeout(atualizarResumo, 0);
  if (!lista.length) return `<div class="bloco vazio"><p>Nenhum PEI encontrado com esses filtros.</p><button class="btn secundario" data-a="limparFiltros" data-g="pei">Limpar filtros</button></div>`;
  return `<div class="tabela-rolagem tabela-mesa"><table class="densa"><caption class="so-leitor">Planos educacionais</caption><thead><tr><th scope="col">Estudante</th><th scope="col" class="so-larga">Turma</th><th scope="col">Situação</th><th scope="col">Etapas</th><th scope="col" class="so-larga">Versão</th><th scope="col">Próxima revisão</th></tr></thead><tbody>
  ${lista.map(p => { const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length, n = diasAte(p.proximaRevisao); return `<tr data-item="pei" data-id="${p.id}"><td><a href="#/peis/${p.id}">${h(a.nome)}</a><small class="so-movel">${h(turma(a.turma).nome)}</small></td><td class="so-larga">${h(turma(a.turma).nome)}</td><td>${seloPei(p)}</td><td><span class="mono">${feitas}/12</span>${miniProg(feitas, 12)}</td><td class="so-larga">${p.versoes.length ? mono('v' + p.versoes.length) : 'Rascunho'}</td><td>${dm(p.proximaRevisao)}${n < 0 ? ' ' + selo('Atrasada', 'vermelho') : ''}</td></tr>`; }).join('')}

function telaPeis() {

    <label>Situação<select data-filtro="pei.status"><option value="">Todas</option>${Object.entries(STATUS_PEI).map(([k, s]) => `<option value="${k}" ${F.pei.status === k ? 'selected' : ''}>${s.nome}</option>`).join('')}</select></label>
    <label>Revisão<select data-filtro="pei.rev"><option value="">Todas</option><option value="pendente" ${F.pei.rev ? 'selected' : ''}>Pendentes</option></select></label></div>
