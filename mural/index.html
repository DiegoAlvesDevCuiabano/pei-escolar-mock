/* Estudantes e PEIs em cartões */
function tabelaEstudantes() {
  const f = F.est, b = f.busca.toLowerCase();
  const lista = alunosVisiveis().filter(a => (!b || a.nome.toLowerCase().includes(b) || a.matricula.includes(b)) && (!f.turma || a.turma === f.turma) && (!f.sit || (f.sit === 'sem' ? !peiDoAluno(a.id) : (peiDoAluno(a.id) || {}).status === f.sit)));
  if (!lista.length) return `<div class="bloco vazio"><p>Nenhum estudante encontrado com esses filtros.</p><button class="btn secundario" data-a="limparFiltros" data-g="est">Limpar filtros</button></div>`;
  return `<div class="grade-est">${lista.map(cartaoEstudante).join('')}</div><p class="sutil pequeno-txt" style="margin-top:.9rem">${lista.length} ${lista.length === 1 ? 'estudante' : 'estudantes'}</p>`;
}
function tabelaPeis() {
  const f = F.pei, b = f.busca.toLowerCase();
  const lista = peisVisiveis().filter(p => { const a = aluno(p.aluno); return (!b || a.nome.toLowerCase().includes(b)) && (!f.status || p.status === f.status) && (!f.rev || ((p.status === 'ativo' || p.status === 'revisao') && diasAte(p.proximaRevisao) <= S.config.diasAlerta)); });
  if (!lista.length) return `<div class="bloco vazio"><p>Nenhum PEI encontrado com esses filtros.</p><button class="btn secundario" data-a="limparFiltros" data-g="pei">Limpar filtros</button></div>`;
  return `<div class="grade-pei">${lista.map(p => {
    const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length, n = diasAte(p.proximaRevisao);
    return `<article class="cartao-pei st-${p.status}" data-item="pei"><div class="cp-faixa">${seloPei(p)}<span>${p.versoes.length ? 'Versão ' + p.versoes.length : 'Rascunho'}</span></div>
      <div class="cp-corpo"><div class="cp-pessoa">${avatar(a.nome, a.id)}<div><a href="#/peis/${p.id}">${h(a.nome)}</a><small>${h(turma(a.turma).nome)}</small></div></div>
      <div><div class="cp-linha"><span><b>${feitas} de 12</b> etapas</span></div><ul class="pontinhos" aria-hidden="true">${ETAPAS.map((_, i) => `<li class="${i < feitas ? 'on' : ''}"></li>`).join('')}</ul></div>
      <div class="cp-linha"><span>Próxima revisão: <b>${fmt(p.proximaRevisao)}</b></span>${n < 0 ? selo('Atrasada', 'vermelho') : ''}</div></div></article>`;
  }).join('')}</div>`;
}

/* Ficha do estudante como perfil */
function telaEstudante(id, aba) {
  const a = aluno(id);
  if (!a) return semAcesso('Estudante não encontrado.');
  if (!alunoVisivel(id)) { auditar('Acesso negado', `Tentou abrir a ficha de ${a.nome}`); return semAcesso('Você não tem vínculo com este estudante.'); }
  const p = peiDoAluno(id), t = turma(a.turma), i = infoAluno(a);
  const restrito = sessao.perfil === 'apoio';
  const abas = [['ficha', 'Ficha'], ['trilha', 'Trilha de metas'], ['historico', 'Histórico']];
  const ativa = aba || 'ficha';
  let corpo = '';
  const destaque = (p && i.ver && i.ms.length) ? `<section class="trilha-destaque" aria-label="Trilha de metas"><h2>Trilha de metas</h2><p>Cada ponto é um registro. A bandeira marca o prazo.</p>${i.ms.map(blocoMeta).join('')}</section>` : '';
  if (ativa === 'ficha') corpo = `${destaque}<div class="duas"><section class="bloco"><h2>Perfil pedagógico</h2>
      ${restrito ? '<p class="nota giz">Seu perfil mostra só o necessário para o apoio em sala.</p>' : ''}
      <dl class="definicoes um"><div><dt>Potencialidades</dt><dd>${h(a.potencialidades)}</dd></div><div><dt>Interesses</dt><dd>${h(a.interesses)}</dd></div><div><dt>Formas de comunicação</dt><dd>${h(a.comunicacao)}</dd></div>
      ${restrito ? '' : `<div><dt>Barreiras à aprendizagem</dt><dd>${h(a.barreiras)}</dd></div>`}<div><dt>Necessidades de acessibilidade</dt><dd>${h(a.acessibilidade)}</dd></div><div><dt>Estratégias pedagógicas</dt><dd>${h(a.estrategias)}</dd></div></dl></section>
    <div><section class="bloco"><h2>Identificação escolar</h2><dl class="definicoes"><div><dt>Turma</dt><dd>${h(t.nome)}, ${h(t.turno.toLowerCase())}</dd></div><div><dt>Ano letivo</dt><dd>${h(a.anoLetivo)}</dd></div><div><dt>Matrícula</dt><dd>${h(a.matricula)}</dd></div><div><dt>Nascimento</dt><dd>${restrito ? 'Restrito' : fmt(a.nascimento)}</dd></div><div><dt>Família</dt><dd>${h(a.responsavel)}</dd></div><div><dt>Telefone</dt><dd>${restrito ? 'Restrito' : h(a.telefone)}</dd></div></dl></section>
    <section class="bloco"><h2>Equipe responsável</h2><ul class="lista">${a.vinculos.map(v => `<li><div class="pessoa">${avatar(nomeProf(v), v)}<div>${h(nomeProf(v))}<small>${h((prof(v) || {}).funcao)}</small></div></div></li>`).join('')}</ul></section>
    <section class="bloco"><h2>Plano educacional</h2>${pode('verPei') ? (p ? `<p>${seloPei(p)}</p><p class="sutil">Próxima revisão em ${fmt(p.proximaRevisao)}</p><a class="btn secundario" href="#/peis/${p.id}">Abrir o PEI</a>` : `<p>Este estudante ainda não tem PEI.</p>${pode('editarPei') ? `<button class="btn" data-a="criarPei" data-id="${a.id}">Iniciar o PEI</button>` : ''}`) : `<p>${seloPei(p)}</p><p class="sutil">O conteúdo do plano fica com a equipe pedagógica.</p>`}</section></div></div>`;
  if (ativa === 'trilha') {
    if (!pode('verPei')) corpo = `<div class="bloco">O acompanhamento pedagógico fica com a equipe.</div>`;
    else if (!p || !metasDoPei(p.id).length) corpo = `<div class="bloco vazio"><p>Ainda não há metas para este estudante.</p></div>`;
    else corpo = `<section class="trilha-destaque" aria-label="Trilha de metas"><h2>Trilha de metas</h2><p>Cada ponto é um registro. A bandeira marca o prazo.</p>${metasDoPei(p.id).map(blocoMeta).join('')}</section>`;
  }
  if (ativa === 'historico') {
    const itens = S.auditoria.filter(x => x.alvo.includes(a.nome));
    const versoes = p && pode('verPei') ? p.versoes.map(v => ({ data: v.data, titulo: `Versão ${v.n} do PEI validada`, texto: v.resumo })) : [];
    const regs = p && pode('verPei') ? metasDoPei(p.id).flatMap(m => m.registros.map(r => ({ data: r.data, titulo: r.atividade, texto: `${m.objetivo}. Por ${nomeProf(r.autor)}.` }))) : [];
    const tudo = [...versoes, ...regs, ...itens.map(x => ({ data: x.data.slice(0, 10), titulo: x.acao, texto: `Por ${x.usuario}` }))].sort((x, y) => y.data.localeCompare(x.data));
    corpo = `<section class="bloco">${tudo.length ? `<ol class="tempo">${tudo.map(x => `<li><h3>${h(x.titulo)}</h3><p class="sutil">${fmt(x.data)}. ${h(x.texto)}</p></li>`).join('')}</ol>` : '<p class="sutil">Nenhum registro ainda.</p>'}</section>`;
  }
  return `<nav class="migalha" aria-label="Caminho"><a href="#/estudantes">Estudantes</a> / ${h(a.nome)}</nav>
  <header class="perfil-topo ${corAvatar(a.id)}">${avatar(a.nome, a.id, true)}<div><h1 tabindex="-1">${h(a.nome)}</h1><p>${h(t.nome)}, ano letivo ${h(a.anoLetivo)}</p><p>${seloPei(p)}${i.atencao ? ` <span class="atencao"><i aria-hidden="true">!</i>Atenção: ${i.motivo}</span>` : ''}</p></div>
    ${i.ver && i.ms.length ? `<div class="perfil-anel">${anel(i.alc, i.ms.length, 96, 'metas alcançadas')}</div>` : ''}
    ${pode('editarEstudante') || pode('verGestao') ? `<div class="perfil-acoes">${pode('editarEstudante') ? `<a class="btn secundario" href="#/estudantes/${a.id}/editar">Editar ficha</a>` : ''}${pode('verGestao') ? `<button class="btn secundario" data-a="modalVinculos" data-id="${a.id}">Associar profissionais</button>` : ''}</div>` : ''}</header>
  <nav class="abas" aria-label="Seções do estudante">${abas.map(([k, n]) => `<a href="#/estudantes/${a.id}${k === 'ficha' ? '' : '/' + k}" ${ativa === k ? 'aria-current="page"' : ''}>${n}</a>`).join('')}</nav>${corpo}`;
}

/* Formulário de 12 etapas: uma por vez, com pontos de progresso */
function telaEtapa(id, nTexto) {
  const p = pei(id), erro = acessoPei(p), n = Math.min(12, Math.max(1, +nTexto || 1));
  if (erro) return semAcesso(erro);
  if (!pode('editarPei')) { auditar('Acesso negado', 'Tentou editar um PEI'); return semAcesso('Seu perfil lê o plano, mas não edita.'); }
  if (p.status !== 'elaboracao' && p.status !== 'revisao') return `${cabeca('Este plano não está aberto para edição', 'Para mudar um plano ativo, inicie uma revisão. Assim a versão validada fica preservada.')}<a class="btn" href="${'#/peis/' + p.id}">Voltar ao plano</a>`;
  const a = aluno(p.aluno), feitas = ETAPAS.filter((_, i) => etapaCompleta(p, i + 1)).length;
  const ir = para => `data-a="irEtapa" data-id="${p.id}" data-n="${n}" data-para="${para}"`;
  return `${cabeca(`PEI de ${a.nome}`, '', `<a class="btn secundario" href="#/peis/${p.id}" data-a="sairEtapa" data-id="${p.id}" data-n="${n}">Salvar e ver o plano</a>`, `<a href="#/peis">PEIs</a> / <a href="#/peis/${p.id}">${h(a.nome)}</a> / Etapa ${n}`)}
  <section class="passos" aria-label="Progresso do plano"><div class="passos-topo"><b>Etapa ${n} de 12</b><span>${feitas} de 12 completas</span></div>
    <div class="passos-barra" aria-hidden="true"><i style="width:${n / 12 * 100}%"></i></div>
    <nav aria-label="Etapas do PEI"><ol class="pontos">${ETAPAS.map((nome, i) => { const ok = etapaCompleta(p, i + 1); return `<li class="${ok ? 'feita' : ''}"><a href="#/peis/${p.id}/etapa/${i + 1}" ${ir(i + 1)} ${n === i + 1 ? 'aria-current="step"' : ''} aria-label="Etapa ${i + 1}: ${h(nome)}${ok ? ', completa' : ''}" title="${h(nome)}"><i>${ok ? '✓' : i + 1}</i></a></li>`; }).join('')}</ol></nav></section>
  <form id="form-etapa" class="bloco etapa-foco" data-pei="${p.id}" data-n="${n}"><p class="etapa-num">Etapa ${n} de 12</p><h2>${h(ETAPAS[n - 1])}</h2>${corpoEtapa(p, n)}
    <div class="rodape-etapa"><button type="button" class="btn secundario" ${ir(n - 1)} ${n === 1 ? 'disabled' : ''}>Etapa anterior</button><span class="espaco"></span><button type="button" class="btn secundario" data-a="salvarRascunho" data-id="${p.id}" data-n="${n}">Salvar rascunho</button>${n < 12 ? `<button type="button" class="btn proxima" ${ir(n + 1)}>Próxima etapa</button>` : ''}</div>
  </form>`;
}

/* Portal da família: a tela mais calorosa */
const FRASE_META = { alcancada: 'Já conseguiu', andamento: 'Está avançando', replanejar: 'Vamos mudar o caminho juntos', nao_iniciada: 'Ainda vai começar' };
function telaFamilia() {
  if (!pode('verFamilia')) return semAcesso('Este portal é para famílias.');
  const a = alunosVisiveis()[0], p = peiDoAluno(a.id), ms = metasDoPei(p.id), c = p.e.compartilhar || [], primeiro = a.nome.split(' ')[0];
  const alc = ms.filter(m => m.status === 'alcancada').length;
  const proxima = S.eventos.filter(e => e.aluno === a.id && diasAte(e.data) >= 0).sort((x, y) => x.data.localeCompare(y.data))[0];
  return `<header class="fam-hero">${avatar(a.nome, a.id, true)}<div><h1 tabindex="-1">O plano de ${h(primeiro)}</h1><p>${h(turma(a.turma).nome)}, ${h(S.escola.nome)}. A escola compartilha aqui o que vocês precisam acompanhar.</p></div></header>
  ${p.ciencia ? `<p class="fam-ok">Você confirmou a leitura do plano em ${fmt(p.ciencia)}. Obrigado por acompanhar.</p>` : `<div class="fam-ciencia"><p>A escola pede que você leia o plano e confirme.</p><button class="btn" data-a="ciencia" data-id="${p.id}">Confirmar que li o plano</button></div>`}
  <div class="duas"><div>
   ${c.includes('objetivos') ? `<section class="fam-bloco objetivo"><h2>O que a escola quer alcançar</h2><p>${h(p.e.objetivoGeral)}</p></section>` : ''}
   ${c.includes('metas') ? `<section><div class="fam-metas-cab"><h2>Como estão as metas</h2><span>${alc} de ${ms.length} alcançadas</span></div>${ms.map(m => `<article class="fam-meta m-${m.status}"><span class="fam-frase"><span aria-hidden="true">${STATUS_META[m.status].sinal}</span>${FRASE_META[m.status]}</span><h3>${h(m.objetivo)}</h3><div class="fam-trilha">${trilha(m, true)}</div></article>`).join('')}</section>` : ''}
  </div><div>
   ${c.includes('emCasa') ? `<section class="fam-bloco casa"><h2>Como ajudar em casa</h2><p>${h(p.e.emCasa)}</p></section>` : ''}
   <section class="fam-bloco encontro"><h2>Próximo encontro</h2>${proxima ? `<span class="data-grande">${fmt(proxima.data)}</span><p>${h(proxima.titulo)}</p>` : '<p>Nenhuma data marcada.</p>'}</section>
  </div></div>`;
}

const r0 = document.documentElement;
r0.dataset.fonte = ler(CHAVE + '_fonte') || 0;
r0.dataset.contraste = ler(CHAVE + '_contraste') || '';
aplicarConsulta();
render();

</script>
<style>.faixa .voltar-menu{color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap;padding:.15rem .25rem}</style>
<script>(function () {
  var original = render;
  function colocar() {
    var faixa = document.querySelector('.faixa');
    if (!faixa || faixa.querySelector('.voltar-menu')) return;
    var a = document.createElement('a');
    a.className = 'voltar-menu'; a.href = '../index.html'; a.textContent = '← Voltar às versões';
    faixa.insertBefore(a, faixa.firstChild);
  }
  render = function () { original.apply(this, arguments); colocar(); };
  colocar();
})();</script>
